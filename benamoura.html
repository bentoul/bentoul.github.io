  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"BENTAMOURA WEB — Séries d'amour","url":"benamoura.html","inLanguage":"fr-FR","description":"Espace Amour BENTAMOURA : les séries publiées dans la feuille Series de benamoura.gs, leurs épisodes, leurs vues et leurs commentaires.","isPartOf":{"@type":"WebSite","name":"BENTAMOURA WEB","url":"index.html"},"primaryImageOfPage":{"@type":"ImageObject","url":"images/seo/benamoura.png","width":1200,"height":630}}</script>

  <script>
    document.addEventListener("btm:ready", () => {
      const { ICON, auth, ui, benamoura, isConfigured, mediaCatalog, creditBadge, creditPaywall } = window.BTM;

      const listBox = document.getElementById("series-list");
      const head = document.getElementById("head-sub");
      const creditsBtn = document.getElementById("hdr-credits");

      function paintCredits() {
        creditsBtn.classList.remove("hidden");
        if (!auth.user) { creditsBtn.textContent = "Se connecter"; return; }
        const n = auth.credits;
        creditsBtn.textContent = n + " crédit" + (n > 1 ? "s" : "");
      }
      paintCredits();
      if (auth.user) auth.refresh().then(paintCredits);
      document.addEventListener("btm:signed-in", paintCredits);
      document.addEventListener("btm:signed-out", paintCredits);

      if (!isConfigured("benamoura")) {
        listBox.innerHTML = ui.empty(ICON.heart, "API Amour non configurée", "Colle l'URL /exec de benamoura.gs dans config.js.");
        head.textContent = "Les séries d'amour viennent de la feuille Series du spreadsheet Benamoura.";
        return;
      }

      const catalogue = mediaCatalog({
        which: "benamoura",
        api: benamoura,
        grid: listBox,
        accent: "rose",
        seriesLabel: "Série d'amour",
        seriesSubtitle: () => "3 épisodes gratuits, puis 1 crédit par épisode",
        showStatus: true,
        commentAuthor: (c) => c.pseudo || c.username || "",
        filter: (s) => String(s.statut || "Publié") === "Publié",
        episodeBadge: creditBadge,

        /* Épisodes payants : mêmes crédits Bentoul que dans l'espace Tech. */
        episodeGuard: creditPaywall({ space: "amour", onCredits: paintCredits }),

        emptyTitle: "Aucune série d'amour",
        emptyText: "Ajoute une ligne dans la feuille Series de benamoura.gs (statut « Publié ») pour la voir ici.",
        onLoaded: (list) => {
          head.textContent = `${list.length} série${list.length > 1 ? "s" : ""} d'amour publiée${list.length > 1 ? "s" : ""} · les 3 premiers épisodes de chaque série sont gratuits, ensuite 1 crédit par épisode.`;
        }
      });

      document.getElementById("btn-reload").addEventListener("click", () => catalogue.load());
      catalogue.load();
    });
  </script>
</head>
<body class="body-layout">
  <div class="page-head page-row">

    </div>
    <div class="btn-row">
      <a class="btn ghost sm" href="rencontres.html">Voir les profils</a>
      <button class="btn ghost sm" id="btn-reload" type="button">Actualiser</button>
      <a class="btn soft sm hidden" id="hdr-credits" href="user.html"></a>
    </div>
  </div>

  <div class="media-grid" id="series-list"><div class="skeleton block"></div><div class="skeleton block"></div><div class="skeleton block"></div><div class="skeleton block"></div></div>

  <script src="app.js" defer></script>
