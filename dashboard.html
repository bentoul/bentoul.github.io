<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard Bentoul</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f5f7fb;--primary:#4f46e5;--line:#e5e7ef;--muted:#68738a}
    *{box-sizing:border-box}body{margin:0}.top{background:#111827;color:#fff;padding:18px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:1.1rem}.top small{color:#cbd5e1}.wrap{max-width:1180px;margin:22px auto;padding:0 18px}.toolbar,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #1e293b0c}.toolbar{padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:1px solid var(--line);background:#fff;color:#25304a;border-radius:10px;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}.tabs button.active,.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:#b91c1c}.status{margin-left:auto;color:var(--muted);font-size:.86rem}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px}.panel{padding:18px}.panel h2{font-size:1rem;margin:0 0 14px}.list{display:grid;gap:10px}.row{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.row strong{display:block;margin-bottom:4px}.meta{color:var(--muted);font-size:.78rem;line-height:1.45;white-space:pre-line}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{padding:7px 9px;font-size:.78rem}.empty{color:var(--muted);padding:20px;text-align:center}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:.78rem;font-weight:700;color:#4b5563}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:#fff}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.message{display:grid;gap:10px}.message-head{display:flex;justify-content:space-between;gap:10px;font-size:.8rem}.message-text{padding:10px;border-radius:10px;background:#f7f8fc;white-space:pre-wrap}.reply{min-height:70px}.hidden{display:none!important}.badge{font-size:.7rem;border-radius:99px;padding:4px 8px;background:#fff7ed;color:#c2410c}.badge.done{background:#ecfdf5;color:#047857}@media(max-width:820px){.grid{grid-template-columns:1fr}}@media(max-width:540px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.status{width:100%;margin-left:0}}
  </style>
  <style>
    .editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}.editor-main{min-width:0}.editor-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#f8fafc;position:sticky;top:0;z-index:2}.editor-toolbar button{width:32px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;color:#334155;cursor:pointer;font-weight:700}.editor-toolbar button:hover{background:#e0e7ff;color:var(--primary)}.editor-toolbar select{height:30px;border:1px solid var(--line);border-radius:6px;background:#fff}.rich-editor{min-height:430px;padding:18px;border:1px solid var(--line);border-radius:0 0 10px 10px;outline:0;background:#fff;line-height:1.7;font-size:1rem}.rich-editor:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px #4f46e51a}.rich-editor:empty:before{content:attr(data-placeholder);color:#94a3b8}.editor-sidebar{border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8fafc;position:sticky;top:18px}.editor-sidebar h3{margin:0 0 10px;font-size:.84rem}.editor-sidebar .field{margin-bottom:10px}.editor-sidebar .field.full{grid-column:auto}.editor-sidebar .field input,.editor-sidebar .field textarea,.editor-sidebar .field select{background:#fff}.sidebar-toggle{display:none}.editor-sidebar .field input[readonly]{background:#eef2ff;color:#64748b}.editor-status{margin-top:8px;color:var(--muted);font-size:.75rem}@media(max-width:820px){.editor-layout{display:block}.editor-sidebar{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(86vw,320px);overflow:auto;border-radius:0;box-shadow:-8px 0 30px #0f172a26;transform:translateX(105%);transition:transform .2s ease}.editor-sidebar.open{transform:translateX(0)}.sidebar-toggle{display:inline-flex;margin-bottom:10px}.editor-toolbar{position:sticky;top:0}.rich-editor{min-height:55vh}.editor-sidebar .form-grid{display:grid;grid-template-columns:1fr}.editor-sidebar .field.full{grid-column:auto}}
  </style>
  <style>
    .grid.list-closed{grid-template-columns:1fr}
    .editor-toolbar{align-items:center;gap:6px;padding:8px 10px;background:#fff;box-shadow:0 4px 14px #1720330b}
    .toolbar-group{display:flex;align-items:center;gap:3px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
    .toolbar-group:last-child{border-right:0;padding-right:0}
    .toolbar-group .toolbar-heading{display:none}
    .editor-toolbar button{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:7px;font-size:.82rem}
    .editor-toolbar button:hover,.editor-toolbar button:focus-visible{border-color:#c7d2fe;background:#eef2ff;outline:0}
    .editor-toolbar select{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:7px;color:#334155;font-weight:650}
    .editor-toolbar .list-toggle{width:auto;padding:0 10px;background:#f8fafc;border-color:var(--line);font-size:.75rem}
    .editor-toolbar .collection-select{min-width:105px;color:var(--primary);border-color:#c7d2fe;background:#eef2ff}
    .editor-toolbar .font-select{min-width:112px}.editor-toolbar .size-select{min-width:82px}.color-palette{display:flex;align-items:center;gap:3px}.color-palette button{width:18px;height:18px;border:2px solid #fff;outline:1px solid #cbd5e1;border-radius:50%;padding:0;flex:0 0 18px}.color-palette button:hover{transform:scale(1.15)}
    @media(max-width:720px){.toolbar-group{padding-right:5px;margin-right:0}.editor-toolbar{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}.editor-toolbar button{flex:0 0 32px}.editor-toolbar select{flex:0 0 auto}.editor-toolbar .list-toggle{display:none}}
  </style>
  <style>
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    .wrap,.grid,.panel,.editor-layout,.editor-main,.editor-sidebar{min-width:0;max-width:100%}
    .editor-toolbar{position:sticky;top:0;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;z-index:20;scrollbar-width:thin}
    .toolbar-group{flex:0 0 auto;white-space:nowrap}
    .rich-editor{width:100%;max-width:100%;min-width:0;max-height:calc(100vh - 250px);overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere;word-break:break-word}
    @media(max-width:820px){
      body{margin:0;padding:0}
      .wrap{width:100%;margin:0;padding:0}
      .grid{width:100%;display:grid;gap:0}
      .panel{width:100%;border-radius:0;border-left:0;border-right:0;padding:12px}
      .grid.list-closed .panel{padding-inline:0}
      .editor-layout{width:100%;display:block}
      .editor-main{width:100%;margin:0;padding:0}
      .editor-toolbar{border-radius:0;border-left:0;border-right:0;padding:7px 8px;background:#fff}
      .rich-editor{border-radius:0;border-left:0;border-right:0;min-height:calc(100vh - 230px);max-height:calc(100vh - 190px);padding:16px 12px}
      .editor-status{padding:0 12px}
      .form-actions{padding:0 12px 12px}
    }
    @media(max-width:420px){
      .panel{padding:8px 0}
      .panel>h2{padding:0 10px}
      .editor-toolbar{gap:4px;padding-inline:6px}
      .toolbar-group{padding-right:4px}
      .editor-toolbar button{width:30px;height:30px}
      .editor-toolbar select{max-width:112px;padding-inline:5px}
      .rich-editor{min-height:calc(100vh - 215px);max-height:calc(100vh - 175px);padding:14px 10px}
    }
  </style>
</head>
<body>
  <header class="top"><div><h1>Dashboard Bentoul</h1><small>Gestion des contenus et du support</small></div><button class="btn" id="refreshBtn">Actualiser</button></header>
  <main class="wrap">
    <section class="toolbar"><div class="field" style="min-width:220px"><label for="adminUsername">Compte administrateur</label><input id="adminUsername" placeholder="nom_utilisateur"></div><div class="tabs"><button class="active" data-tab="astuces">ASTUCES</button><button data-tab="histoire">HISTOIRE</button><button data-tab="boutique">BOUTIQUE</button><button data-tab="messages">MESSAGES</button></div><span class="status" id="status">Entrez votre compte ADMIN puis actualisez.</span></section>
    <section class="grid">
      <div class="panel" id="listPanel"><h2 id="listTitle">Astuces</h2><div id="list" class="list"></div></div>
      <div class="panel"><h2 id="formTitle">Ajouter une ressource</h2><form id="editorForm"><div class="editor-layout"><div class="editor-main"><div class="editor-toolbar" id="editorToolbar" aria-label="Barre d’outils de mise en forme"><select data-command="formatBlock" aria-label="Format"><option value="p">Paragraphe</option><option value="h2">Titre 2</option><option value="h3">Titre 3</option><option value="blockquote">Citation</option></select><button type="button" data-command="bold" title="Gras"><b>G</b></button><button type="button" data-command="italic" title="Italique"><i>I</i></button><button type="button" data-command="underline" title="Souligné"><u>S</u></button><button type="button" data-command="strikeThrough" title="Barré"><s>B</s></button><button type="button" data-command="insertUnorderedList" title="Liste à puces">☷</button><button type="button" data-command="insertOrderedList" title="Liste numérotée">1.</button><button type="button" data-command="justifyLeft" title="Aligner à gauche">≡</button><button type="button" data-command="justifyCenter" title="Centrer">≣</button><button type="button" data-command="justifyRight" title="Aligner à droite">≡</button><button type="button" data-command="createLink" title="Insérer un lien">🔗</button><button type="button" data-command="insertImage" title="Insérer une image">▧</button><button type="button" data-command="removeFormat" title="Effacer le format">Tx</button><button type="button" data-command="undo" title="Annuler">↶</button><button type="button" data-command="redo" title="Rétablir">↷</button></div><div id="richEditor" class="rich-editor" contenteditable="true" data-placeholder="Commencez à rédiger votre contenu…" aria-label="Éditeur de contenu"></div><div class="editor-status">Éditeur enrichi · le contenu est sauvegardé au format HTML</div></div><aside id="editorSidebar" class="editor-sidebar"><button type="button" class="btn sidebar-toggle" id="sidebarToggle">Options</button><h3>Paramètres de publication</h3><div id="formFields" class="form-grid"></div></aside></div><div class="form-actions"><button type="button" class="btn" id="cancelBtn">Annuler</button><button class="btn primary">Enregistrer</button></div></form><div id="replyBox" class="hidden"></div></div>
    </section>
  </main>
  <script>
    const API="https://script.google.com/macros/s/AKfycbzAX4YuzRIx8OxWMd5ggA-Lu_Ou1AaVeBAfKlgxGtQ5DpaOiu0ODT_WmdARaVLZj8en/exec";
    const definitions={
      astuces:{label:"Astuces",fields:[['ID','Identifiant'],['TITRE','Titre'],['SHORT_DESCRIPTION','Résumé'],['DESCRIPTION','Description','textarea'],['TYPE','Type'],['URLIMAGE','Image'],['URLVIDEO','Vidéo'],['URLREDIRECTION','Lien']]},
      histoire:{label:"Histoire",fields:[['ID','Identifiant'],['TITRE','Titre'],['SOUS_TITRE','Sous-titre'],['CONTNUE','Contenu','textarea'],['TYPE','Type'],['URLREDIRECTION','Lien'],['URLAUDIO','Audio'],['URLVIDEO','Vidéo']]},
      boutique:{label:"Boutique",fields:[['ID','Identifiant'],['TITREQ','Titre'],['DESCRIPTION','Description','textarea'],['IMAGE','Image'],['URDOENLOAD','Lien de téléchargement'],['CREDITS','Crédits','number'],['TYPE','Type']]}
    };
    let data={astuces:[],histoire:[],boutique:[],messages:[]}, tab='astuces', editing=null;
    const $=s=>document.querySelector(s); const esc=v=>String(v??'');
    function username(){return $('#adminUsername').value.trim()||localStorage.getItem('devmaster_username')||''}
    function say(text,error=false){$('#status').textContent=text;$('#status').style.color=error?'#b91c1c':''}
    function id(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
    async function api(url,options){const r=await fetch(url,options);const out=await r.json();if(!r.ok||out.status!=='success')throw new Error(out.message||'Erreur serveur');return out}
    async function load(){try{say('Chargement…');const out=await api(API+'?action=getDashboard&username='+encodeURIComponent(username()));data={astuces:out.astuces||[],histoire:out.histoire||[],boutique:out.boutique||[],messages:out.messages||[]};localStorage.setItem('devmaster_username',username());render();say('Données chargées.')}catch(e){say(e.message,true)}}
    function render(){renderList();renderForm()}
    function renderList(){const list=$('#list');$('#listTitle').textContent=tab==='messages'?'Messages clients':definitions[tab].label;list.textContent='';if(!data[tab].length){list.innerHTML='<div class="empty">Aucun élément.</div>';return}data[tab].forEach(item=>{const row=document.createElement('article');row.className=tab==='messages'?'row message':'row';if(tab==='messages'){const head=document.createElement('div');head.className='message-head';head.innerHTML='<strong></strong><span class="badge"></span>';head.querySelector('strong').textContent=(item.NOM||item.USERNAME||'Visiteur')+' · '+(item.EMAIL||'');head.querySelector('span').textContent=item.STATUT||'NOUVEAU';if((item.STATUT||'')==='RÉPONDU')head.querySelector('span').classList.add('done');const text=document.createElement('div');text.className='message-text';text.textContent=item.MESSAGE||'';const meta=document.createElement('div');meta.className='meta';meta.textContent=item.REPONSE?'Réponse : '+item.REPONSE:'';const actions=document.createElement('div');actions.className='actions';const reply=document.createElement('button');reply.className='btn primary';reply.textContent='Répondre';reply.onclick=()=>showReply(item);actions.append(reply);row.append(head,text,meta,actions)}else{const title=document.createElement('div');title.innerHTML='<strong></strong><span class="meta"></span>';title.querySelector('strong').textContent=item.TITRE||item.TITREQ||item.ID||'Sans titre';title.querySelector('.meta').textContent=(item.TYPE||'')+' · ligne '+item.row;const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn';edit.textContent='Modifier';edit.onclick=()=>editItem(item);const del=document.createElement('button');del.className='btn danger';del.textContent='Supprimer';del.onclick=()=>deleteItem(item);actions.append(edit,del);row.append(title,actions)}list.append(row)})}
    function editorKey(){return tab==='histoire'?'CONTNUE':'DESCRIPTION'}
    function renderForm(){const fields=$('#formFields'),form=$('#editorForm'),reply=$('#replyBox'),editor=$('#richEditor');if(tab==='messages'){form.classList.add('hidden');reply.classList.remove('hidden');reply.innerHTML='<div class="empty">Sélectionnez un message pour répondre.</div>';return}form.classList.remove('hidden');reply.classList.add('hidden');$('#formTitle').textContent=editing?'Modifier une ressource':'Ajouter une ressource';fields.textContent='';const contentKey=editorKey();editor.innerHTML=editing?esc(editing[contentKey]):'';definitions[tab].fields.forEach(([key,label,type])=>{if(key===contentKey)return;const wrap=document.createElement('div');wrap.className='field';const l=document.createElement('label');l.textContent=label;const input=document.createElement(type==='textarea'?'textarea':'input');input.name=key;input.type=type||'text';input.value=editing?esc(editing[key]):key==='ID'?id():'';if(key==='ID')input.readOnly=true;wrap.append(l,input);fields.append(wrap)})}
    function editItem(item){editing=item;renderForm();window.scrollTo({top:0,behavior:'smooth'})}
    async function deleteItem(item){if(!confirm('Supprimer cette ressource ?'))return;try{await api(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'dashboardDelete',username:username(),collection:tab,row:item.row})});say('Ressource supprimée.');await load()}catch(e){say(e.message,true)}}
    function showReply(item){$('#replyBox').classList.remove('hidden');$('#editorForm').classList.add('hidden');$('#formTitle').textContent='Répondre au client';const box=document.createElement('div');box.className='message';box.innerHTML='<div class="meta"></div><textarea class="reply" placeholder="Votre réponse…"></textarea><div class="form-actions"><button class="btn primary">Envoyer la réponse</button></div>';box.querySelector('.meta').textContent=(item.NOM||item.USERNAME||'Visiteur')+' · '+(item.EMAIL||'');box.querySelector('textarea').value=item.REPONSE||'';box.querySelector('button').onclick=async()=>{try{await api(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'supportReply',username:username(),row:item.row,reply:box.querySelector('textarea').value})});say('Réponse enregistrée.');await load()}catch(e){say(e.message,true)}};$('#replyBox').replaceChildren(box)}
    $('#editorForm').onsubmit=async e=>{e.preventDefault();const values={};new FormData(e.target).forEach((v,k)=>values[k]=v);values[editorKey()]=cleanEditorMarkup($('#richEditor').innerHTML);try{await api(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'dashboardSave',username:username(),collection:tab,row:editing?editing.row:0,values})});editing=null;say('Ressource enregistrée.');await load()}catch(e){say(e.message,true)}};
    document.querySelector('.tabs').style.display='none';
    const listToggle=document.createElement('button');listToggle.type='button';listToggle.className='btn list-toggle';listToggle.textContent='Masquer la liste';listToggle.title='Afficher ou masquer la liste des contenus';listToggle.onclick=()=>{const hidden=$('#listPanel').classList.toggle('hidden');document.querySelector('.grid').classList.toggle('list-closed',hidden);listToggle.textContent=hidden?'Afficher la liste':'Masquer la liste'};$('#editorToolbar').prepend(listToggle);
    const collectionSelect=document.createElement('select');collectionSelect.id='collectionSelect';collectionSelect.className='collection-select';collectionSelect.title='Choisir la section';[['astuces','Astuces'],['histoire','Histoire'],['boutique','Boutique'],['messages','Messages']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;collectionSelect.append(option)});collectionSelect.value=tab;collectionSelect.onchange=()=>{tab=collectionSelect.value;editing=null;render()};$('#editorToolbar').querySelector('select').before(collectionSelect);
    const mobileSidebarToggle=document.createElement('button');mobileSidebarToggle.type='button';mobileSidebarToggle.className='btn sidebar-toggle';mobileSidebarToggle.textContent='Options';mobileSidebarToggle.onclick=()=>$('#editorSidebar').classList.toggle('open');$('#editorToolbar').before(mobileSidebarToggle);
    const editorToolbar=$('#editorToolbar'),formatSelect=editorToolbar.querySelector('[data-command="formatBlock"]');
    const toolbarButton=command=>editorToolbar.querySelector(`[data-command="${command}"]`);
    const toolbarGroup=(name,nodes)=>{const group=document.createElement('div');group.className='toolbar-group';group.setAttribute('role','group');group.setAttribute('aria-label',name);nodes.filter(Boolean).forEach(node=>{if(node.title&&!node.getAttribute('aria-label'))node.setAttribute('aria-label',node.title);group.append(node)});return group};
    formatSelect.replaceChildren(...[['p','Paragraphe'],['h1','Titre 1'],['h2','Titre 2'],['h3','Titre 3'],['h4','Titre 4'],['h5','Titre 5'],['h6','Titre 6'],['blockquote','Citation']].map(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;return option}));
    const fontFamilySelect=document.createElement('select');fontFamilySelect.className='font-select';fontFamilySelect.dataset.command='fontName';fontFamilySelect.title='Police';[['Arial','Arial'],['Georgia','Georgia'],['Verdana','Verdana'],['Tahoma','Tahoma'],['Courier New','Courier New'],['Times New Roman','Times New Roman']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;fontFamilySelect.append(option)});
    const fontSizeSelect=document.createElement('select');fontSizeSelect.className='size-select';fontSizeSelect.dataset.command='fontSize';fontSizeSelect.title='Taille';[['12px','Petit'],['14px','Normal'],['16px','Moyen'],['18px','Grand'],['24px','Très grand'],['32px','Titre']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;fontSizeSelect.append(option)});
    const colorPalette=document.createElement('div');colorPalette.className='color-palette';colorPalette.title='Couleur du texte';['#111827','#dc2626','#d97706','#16a34a','#2563eb','#7c3aed','#db2777','#ffffff'].forEach(color=>{const button=document.createElement('button');button.type='button';button.title=`Couleur ${color}`;button.setAttribute('aria-label',button.title);button.dataset.color=color;button.style.backgroundColor=color;button.onclick=()=>applyEditorStyle('foreColor',color);colorPalette.append(button)});
    editorToolbar.replaceChildren(
      toolbarGroup('Navigation',[listToggle,collectionSelect]),
      toolbarGroup('Format du texte',[formatSelect,fontFamilySelect,fontSizeSelect,toolbarButton('bold'),toolbarButton('italic'),toolbarButton('underline'),toolbarButton('strikeThrough'),toolbarButton('removeFormat')]),
      toolbarGroup('Couleur',[colorPalette]),
      toolbarGroup('Listes',[toolbarButton('insertUnorderedList'),toolbarButton('insertOrderedList')]),
      toolbarGroup('Alignement',[toolbarButton('justifyLeft'),toolbarButton('justifyCenter'),toolbarButton('justifyRight')]),
      toolbarGroup('Insertion',[toolbarButton('createLink'),toolbarButton('insertImage')]),
      toolbarGroup('Historique',[toolbarButton('undo'),toolbarButton('redo')])
    );
    const allowedFontSizes=['12px','14px','16px','18px','24px','32px'];
    function cleanEditorMarkup(html){const holder=document.createElement('div');holder.innerHTML=html;holder.querySelectorAll('font').forEach(font=>{const span=document.createElement('span');if(font.getAttribute('face'))span.style.fontFamily=font.getAttribute('face');if(font.getAttribute('color'))span.style.color=font.getAttribute('color');if(font.getAttribute('size'))span.style.fontSize=allowedFontSizes[Math.min(Number(font.getAttribute('size'))||3,allowedFontSizes.length)-1];span.innerHTML=font.innerHTML;font.replaceWith(span)});holder.querySelectorAll('[style]').forEach(node=>{if(node.style.fontSize&&!allowedFontSizes.includes(node.style.fontSize))node.style.removeProperty('font-size');if(node.style.fontFamily)node.style.fontFamily=node.style.fontFamily.replace(/["']/g,'');if(!node.getAttribute('style')||!node.getAttribute('style').trim())node.removeAttribute('style')});holder.querySelectorAll('*').forEach(node=>{if(!node.textContent.trim()&&!node.querySelector('img,br,video,iframe'))node.remove()});holder.querySelectorAll('span').forEach(node=>{const next=node.nextElementSibling;if(next&&next.tagName==='SPAN'&&node.getAttribute('style')===next.getAttribute('style')){node.innerHTML+=next.innerHTML;next.remove()}});return holder.innerHTML.trim()}
    function applyEditorStyle(command,value){const editor=$('#richEditor');editor.focus();document.execCommand('styleWithCSS',false,true);if(command==='fontSize'){document.execCommand('fontSize',false,'7');editor.querySelectorAll('font[size="7"]').forEach(node=>{node.style.fontSize=value;node.removeAttribute('size')})}else if(command==='fontName'){document.execCommand('fontName',false,value)}else document.execCommand(command,false,value);editor.innerHTML=cleanEditorMarkup(editor.innerHTML)}
    function runEditorCommand(command){const editor=$('#richEditor');editor.focus();if(command==='createLink'){const url=prompt('URL du lien :','https://');if(url)document.execCommand('createLink',false,url)}else if(command==='insertImage'){const url=prompt('URL de l’image :','https://');if(url)document.execCommand('insertImage',false,url)}else document.execCommand(command,false,null);editor.innerHTML=cleanEditorMarkup(editor.innerHTML)}
    document.querySelectorAll('#editorToolbar [data-command]').forEach(control=>{control.addEventListener('mousedown',e=>e.preventDefault());const eventName=control.tagName==='SELECT'?'change':'click';control.addEventListener(eventName,()=>{if(control.dataset.command==='fontName'||control.dataset.command==='fontSize'){applyEditorStyle(control.dataset.command,control.value)}else if(control.dataset.command==='formatBlock'){$('#richEditor').focus();document.execCommand('formatBlock',false,control.value);$('#richEditor').innerHTML=cleanEditorMarkup($('#richEditor').innerHTML)}else runEditorCommand(control.dataset.command)})});
    $('#sidebarToggle').onclick=()=>$('#editorSidebar').classList.toggle('open');$('#cancelBtn').onclick=()=>{editing=null;renderForm()};$('#refreshBtn').onclick=load;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=null;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#adminUsername').value=localStorage.getItem('devmaster_username')||'';render();
  </script>
</body>
