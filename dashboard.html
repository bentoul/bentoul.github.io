<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Bentoul</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- En-tête et actions globales -->
  <header class="top">
    <div class="top-actions">
      <div class="field">
        <label for="adminUsername">Compte administrateur</label>
        <input id="adminUsername" placeholder="Compte administrateur" autocomplete="username">
      </div>
      <button class="btn icon-btn" id="listOpenBtn" type="button" title="Ouvrir la liste" aria-label="Ouvrir la liste" aria-expanded="false" aria-controls="listPanel">☷</button>
      <button class="btn icon-btn" id="optionsBtn" type="button" title="Ouvrir les options" aria-label="Ouvrir les options" aria-expanded="false" aria-controls="editorSidebar">⚙</button>
      <button class="btn primary icon-btn" id="refreshBtn" type="button" title="Actualiser" aria-label="Actualiser">↻</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Barre de statut : les onglets sont pilotés par le sélecteur de l'éditeur -->
    <section class="toolbar">
      <div class="tabs">
        <button class="active" data-tab="astuces" type="button">ASTUCES</button>
        <button data-tab="histoire" type="button">HISTOIRE</button>
        <button data-tab="boutique" type="button">BOUTIQUE</button>
        <button data-tab="messages" type="button">MESSAGES</button>
      </div>
      <span class="status" id="status">Entrez votre compte ADMIN puis actualisez.</span>
    </section>

    <!-- Liste coulissante et formulaire d'édition -->
    <section class="grid">
      <aside class="panel" id="listPanel" aria-label="Liste des contenus">
        <button class="btn drawer-close" id="listCloseBtn" type="button" aria-label="Fermer la liste">×</button>
        <h2 id="listTitle">Astuces</h2>
        <div class="list" id="list"></div>
      </aside>

      <section class="panel">
        <h2 id="formTitle">Ajouter une ressource</h2>
        <form id="editorForm">
          <div class="editor-layout">
            <div class="editor-main">
              <!-- La barre est complétée par dashboard.js -->
              <div class="editor-toolbar" id="editorToolbar" aria-label="Barre d'outils de mise en forme">
                <select data-command="formatBlock" aria-label="Format"></select>
                <button type="button" data-command="bold" title="Gras"><b>G</b></button>
                <button type="button" data-command="italic" title="Italique"><i>I</i></button>
                <button type="button" data-command="underline" title="Souligné"><u>S</u></button>
                <button type="button" data-command="strikeThrough" title="Barré"><s>B</s></button>
                <button type="button" data-command="insertUnorderedList" title="Liste à puces">☷</button>
                <button type="button" data-command="insertOrderedList" title="Liste numérotée">1.</button>
                <button type="button" data-command="justifyLeft" title="Aligner à gauche">≡</button>
                <button type="button" data-command="justifyCenter" title="Centrer">≣</button>
                <button type="button" data-command="justifyRight" title="Aligner à droite">≡</button>
                <button type="button" data-command="createLink" title="Insérer un lien">🔗</button>
                <button type="button" data-command="insertImage" title="Insérer une image">▧</button>
                <button type="button" data-command="clearFormatting" title="Effacer tous les formats">Tx</button>
                <button type="button" data-command="undo" title="Annuler">↶</button>
                <button type="button" data-command="redo" title="Rétablir">↷</button>
                <select id="collectionSelect" class="collection-select" aria-label="Choisir la section">
                  <option value="astuces">Astuces</option>
                  <option value="histoire">Histoire</option>
                  <option value="boutique">Boutique</option>
                  <option value="messages">Messages</option>
                </select>
              </div>
              <div id="richEditor" class="rich-editor" contenteditable="true" data-placeholder="Commencez à rédiger votre contenu…" aria-label="Éditeur de contenu"></div>
              <div class="editor-status">Éditeur enrichi · le contenu est sauvegardé au format HTML</div>
            </div>

            <!-- Les champs sont générés selon la collection sélectionnée -->
            <aside class="editor-sidebar" id="editorSidebar">
              <h3>Paramètres de publication</h3>
              <div class="form-grid" id="formFields"></div>
            </aside>
          </div>

          <div class="form-actions">
            <button class="btn" id="cancelBtn" type="button">Annuler</button>
            <button class="btn primary" type="submit">Enregistrer</button>
          </div>
        </form>
        <div class="hidden" id="replyBox"></div>
      </section>
    </section>
  </main>

  <!-- Fond commun pour fermer un panneau coulissant -->
  <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="Fermer le panneau"></button>

  <script src="js/dashboard.js"></script>
</body>
</html>
