<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>BENTOUL STORIES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F8F9FA;
      --surface-color: #FFFFFF;
      --surface-hover: #F1F3F5;
      --text-color: #171717;
      --text-muted: #64748B;
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #EDE9FE;
      --border-color: #E2E8F0;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --shadow-hover: 0 12px 28px -4px rgba(124, 58, 237, 0.12), 0 4px 12px -2px rgba(0, 0, 0, 0.05);
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-title: 'Cinzel', serif;
      --font-reader: 'Lora', Georgia, serif;
      --radius: 18px;
      --radius-sm: 10px;
      --reader-font-size: 18px;
    }

    [data-theme="dark"] {
      --bg-color: #111111;
      --surface-color: #1A1A1A;
      --surface-hover: #242424;
      --text-color: #F5F5F5;
      --text-muted: #94A3B8;
      --primary: #8B5CF6;
      --primary-hover: #A78BFA;
      --primary-light: #2E1065;
      --border-color: #27272A;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 12px 28px -4px rgba(139, 92, 246, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-ui);
      min-height: 100vh;
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
      padding: 16px 14px 40px;
    }

    #app {
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    /* Barre de progression de lecture */
    #read-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #EC4899);
      width: 0%;
      z-index: 9999;
      transition: width 0.1s linear;
    }

    .fade-in {
      animation: fadeIn 0.25s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-ui);
      transition: all 0.2s ease;
      background: var(--surface-color);
      color: var(--text-color);
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF !important;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-color);
      border-color: var(--border-color);
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .btn-danger {
      background: #DC2626;
      color: #FFFFFF !important;
      border-color: #DC2626;
    }

    .btn-danger:hover {
      background: #B91C1C;
    }

    .btn-icon {
      padding: 8px 12px;
      font-size: 1rem;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #1E293B;
      color: #FFFFFF;
      padding: 12px 22px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 10000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .hero {
      text-align: center;
      padding: 24px 8px 18px;
    }

    .app-title {
      font-family: var(--font-title);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .app-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 400px;
      margin: 0 auto;
    }

    .quick-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .series-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }

    .series-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    @media (min-width: 600px) {
      .series-card {
        flex-direction: row;
      }
      .series-card .card-img-wrapper {
        flex: 0 0 190px;
      }
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #000;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .series-card:hover .card-img {
      transform: scale(1.03);
    }

    .badge-cat {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      color: #FFF;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-image-info {
      position: absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.38);
      backdrop-filter: blur(5px);
      color: #FFF;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    .card-image-info .card-title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .card-image-info .card-desc {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      margin-bottom: 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .card-episode-titles {
      margin: 0 0 14px;
      padding-left: 18px;
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .card-episodes-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .series-card-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .resume-banner {
      background: linear-gradient(135deg, var(--surface-color) 0%, var(--surface-hover) 100%);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .resume-info h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .resume-info p {
      font-weight: 600;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    @media (min-width: 480px) {
      .resume-info p {
        max-width: 380px;
      }
    }

    .detail-hero {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .detail-cover {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .detail-hero-content {
      padding: 18px;
      background: var(--surface-color);
    }

    .detail-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .detail-desc {
      font-size: 0.92rem;
      color: var(--text-color);
      line-height: 1.6;
    }

    .section-heading {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .episode-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .episode-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      transition: border-color 0.2s;
    }

    .episode-card-image {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 8px;
    }

    .episode-card:hover {
      border-color: var(--primary);
    }

    .episode-number {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .episode-title {
      font-size: 0.95rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .episode-card .btn {
      width: 100%;
      padding: 8px 6px;
      font-size: 0.8rem;
    }

    .episode-card-actions {
      display: grid;
      gap: 6px;
    }

    .series-detail-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .series-detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .reader-view {
      width: 100vw;
      min-height: 100vh;
      margin-left: calc(50% - 50vw);
      padding: 16px clamp(14px, 4vw, 40px) 40px;
      background: var(--bg-color);
    }

    .reader-view .reader-content,
    .reader-view .episode-audio {
      width: 100%;
      max-width: none;
    }

    .reader-episode-image {
      display: block;
      width: min(100%, 420px);
      max-height: 75vh;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      margin: 0 auto 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .reader-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .reader-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reader-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .reader-series-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .reader-episode-num {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .reader-episode-title {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .reader-content {
      font-family: var(--font-reader);
      font-size: var(--reader-font-size);
      line-height: 1.85;
      color: var(--text-color);
      max-width: 680px;
      margin: 0 auto 30px;
      letter-spacing: 0.01em;
    }

    .reader-content p {
      margin-bottom: 1.6em;
      text-align: justify;
    }

    .episode-audio {
      display: block;
      width: 100%;
      max-width: 680px;
      margin: 0 auto 24px;
    }

    .reader-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 0;
      border-top: 1px solid var(--border-color);
      margin-top: 30px;
    }

    .reader-extra-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 30px;
    }

    .search-input-wrapper {
      position: relative;
      margin: 16px 0 20px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      font-family: var(--font-ui);
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* Modal Formulaire d'ajout */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-section-title {
      margin: 18px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-ui);
      font-size: 0.92rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .episode-fields-toggle {
      width: 100%;
      margin: 4px 0 12px;
    }

    .episode-editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-bottom: 0;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: var(--surface-hover);
    }

    .episode-editor-toolbar button {
      min-width: 36px;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 7px;
      background: var(--surface-color);
      color: var(--text-color);
      font: inherit;
      cursor: pointer;
    }

    .episode-editor-toolbar button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .episode-editor {
      min-height: 240px;
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      background: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-reader);
      line-height: 1.8;
      outline: none;
      overflow-wrap: anywhere;
    }

    .episode-editor:focus {
      border-color: var(--primary);
    }

    .episode-editor p {
      margin-bottom: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }

    .empty-state p {
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #10B981;
      margin-bottom: 10px;
    }

    .badge-live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <main id="accueil" class="home-page series-application">
    <div id="read-progress-bar"></div>
    <div id="toast" class="toast"></div>

    <div id="app"></div>
  </main>

  <script src="../app.js"></script>
  <style>
    html,
    body {
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    .header,
    .layout,
    .footer {
      width: 100%;
      max-width: 1440px;
    }

    .layout {
      grid-template-columns: minmax(190px, 240px) minmax(0, 1fr);
    }

    .layout > main#accueil {
      width: 100%;
      max-width: none;
      min-width: 0;
      padding: clamp(12px, 3vw, 36px);
    }

    #app,
    #app > .fade-in {
      width: 100%;
      max-width: none;
      min-width: 0;
    }

    .series-card,
    .detail-hero,
    .episode-card,
    .modal-card {
      min-width: 0;
    }

    .reader-view {
      width: 100%;
      min-width: 0;
      margin-left: 0;
      padding: 8px 0 24px;
      overflow-wrap: anywhere;
    }

    .reader-view .reader-content,
    .reader-view .episode-audio {
      width: 100%;
      max-width: none;
    }

    .modal-card form > div[style*="grid-template-columns"] {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
    }

    @media (max-width: 640px) {
      .header,
      .layout,
      .footer {
        width: 100%;
        max-width: 100%;
      }

      .layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .layout > main#accueil {
        padding: 12px !important;
      }

      .series-detail-toolbar {
        flex-wrap: wrap;
      }

      .series-detail-actions {
        justify-content: flex-start;
      }

      .home-view > .series-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .series-card {
        flex-direction: column;
      }

      .home-view .series-card {
        min-width: 0;
      }

      .card-content {
        min-width: 0;
        padding: 14px;
      }

      .home-view .card-content {
        padding: 10px;
      }

      .home-view .card-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .home-view .series-card-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .home-view .series-card-actions .btn {
        padding: 8px 10px;
        font-size: 0.78rem;
      }

      .episode-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .episode-card {
        padding: 8px 6px;
        gap: 8px;
      }

  <script>

    const API_URL = "https://script.google.com/macros/s/AKfycbxUu3Fy_VKO7qcNrVYwH3p79OY7mrklGlV0uW3YyctQtOeA2CyiagR4sAHe-IUbzFWhNw/exec";
    const TARGET_SHEET = "Series";

    /* Données de secours (au cas où l'API est hors ligne ou vide) */
    let seriesData = [

      {

    /* ==========================================================================

    const STORAGE_KEY_FAV = "bentoul_stories_favs";
    const STORAGE_KEY_HIST = "bentoul_stories_history";
    const STORAGE_KEY_THEME = "bentoul_stories_theme";
    const STORAGE_KEY_FONT = "bentoul_stories_fontsize";

    let state = {

      theme: localStorage.getItem(STORAGE_KEY_THEME) || "light",
      fontSize: parseInt(localStorage.getItem(STORAGE_KEY_FONT) || "18", 10),
      searchQuery: "",
      isLoading: false,
      isLiveConnected: false
    };

    document.documentElement.setAttribute("data-theme", state.theme);
    document.documentElement.style.setProperty("--reader-font-size", state.fontSize + "px");

    function getUserSession() {
      try {
        const session = JSON.parse(sessionStorage.getItem("bcreation-user-session") || "null");
        return session && session.user && session.token ? session : null;
      } catch (err) {
        console.warn("Impossible de lire la session utilisateur.", err);
        return null;
      }
    }

    function isAdminUser() {
      const session = getUserSession();
      const role = String(session?.user?.role || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z]/g, "");
      return Boolean(session && ["admin", "administrator", "administrateur", "superadmin"].includes(role));
    }

    window.addEventListener("bcreation-session-changed", () => {
      renderView();
    });

    /* ==========================================================================
       3. NOTIFICATION TOAST
       ========================================================================== */
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    /* ==========================================================================
       4. CHARGEMENT ET PARSING DEPUIS GOOGLE SHEETS
       ========================================================================== */
    async function loadSeriesFromSheets() {
      if (!API_URL || API_URL.includes("AKfycbzLekE76D8W_FpEwO1l1GZ4uD12N3YyFf4b")) {
        // En mode hors ligne ou avant configuration URL
        return;
      }
      try {
        state.isLoading = true;
        renderView();
        const res = await fetch(`${API_URL}?action=getProducts&sheet=${TARGET_SHEET}`);
        const data = await res.json();

        if (data && data.success && Array.isArray(data.products) && data.products.length > 0) {
          const grouped = {};
          let nextGeneratedId = 1;

          data.products.forEach(row => {
            const episodeTitle = row.TitreEpisode || row.titreEpisode || row.Titre || row.titre || "";
            const seriesName = String(row.SeriesTitle || row.seriestitle || episodeTitle || "Histoire sans titre").trim();
            const epNum = Number(row.EpisodeNumber || row.episodenumber || 1);
            const epTitle = String(episodeTitle || `Épisode ${epNum}`).trim();
            const epText = String(row.contenuEpisode || row.ContenuEpisode || row.Description || row.description || "<p>Contenu à venir...</p>");
            const cat = row.Categorie || row.categorie || "Général";
            const cover = window.normalizeGoogleDriveImageUrl(row.ImageUrl || row.imageurl || "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=900&q=80");
            const seriesDescription = row.SeriesDescription || row.seriesdescription || "";
            const audioUrl = row.UrlAudio || row.urlaudio || row.UrlRedirection || row.urlredirection || "";
            const episodeImageUrl = window.normalizeGoogleDriveImageUrl(row.imageEpisode || row.ImageEpisode || "");
            const episodeContentHTML = epText.includes("<")
              ? epText
              : `<p>${escapeHTML(epText).replace(/\n/g, "</p><p>")}</p>`;

            if (!grouped[seriesName]) {
              grouped[seriesName] = {
                id: nextGeneratedId++,
                title: seriesName,
                category: cat,
                cover: cover,
                description: seriesDescription || `Série captivante : ${seriesName}.`,
                episodes: []
              };
            }

            grouped[seriesName].episodes.push({
              id: epNum,
              sheetId: String(row.ID || row.id || ""),
              title: epTitle,
              audioUrl: audioUrl,
              imageUrl: episodeImageUrl,
              content: window.cleanEpisodeHTML(episodeContentHTML)
            });
          });

          // Trie des épisodes par numéro
          const resultList = Object.values(grouped).map(series => {
            series.episodes.sort((a, b) => a.id - b.id);
            return series;
          });

          if (resultList.length > 0) {
            seriesData = resultList;
            state.isLiveConnected = true;
            showToast("Séries synchronisées avec Google Sheets");
          }
        }
      } catch (err) {
        console.warn("Impossible de synchroniser avec Google Sheets, utilisation des données locales :", err);
      } finally {
        state.isLoading = false;
        renderView();
      }
    }

    /* ==========================================================================
       5. ENVOI D'UNE SÉRIE / ÉPISODE VERS GOOGLE SHEETS
       ========================================================================== */
    async function uploadImageFile(file) {
      if (!file) return "";
      if (file.size > 3 * 1024 * 1024) {
        throw new Error("Chaque image doit faire moins de 3 Mo.");
      }
      const imageDataUrl = await readImageAsDataUrl(file);
      const uploadResponse = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "uploadContentImage",
          sheet: TARGET_SHEET,
          fileName: file.name,
          mimeType: file.type,
          base64: imageDataUrl
        })
      });
      const uploadData = await uploadResponse.json();
      if (!uploadResponse.ok || !uploadData?.success || !uploadData.imageUrl) {
        throw new Error(uploadData?.message || `Échec de l'envoi de l'image (HTTP ${uploadResponse.status}).`);
      }
      return window.normalizeGoogleDriveImageUrl(uploadData.imageUrl);
    }

    async function submitNewEpisode(formData) {
      if (!API_URL || API_URL.includes("AKfycbzLekE76D8W_FpEwO1l1GZ4uD12N3YyFf4b")) {
        if (formData.coverFile) {
          formData.cover = await readImageAsDataUrl(formData.coverFile);
        }
        if (formData.episodeImageFile) {
          formData.episodeImageUrl = await readImageAsDataUrl(formData.episodeImageFile);
        }
        addEpisodeLocally(formData);
        showToast("Enregistré en mode local !");
        closeModal();
        return;
      }

      try {
        state.isLoading = true;
        const submitButton = document.querySelector(".modal-card button[type='submit']");
        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = "Enregistrement...";
        }

        if (formData.coverFile) formData.cover = await uploadImageFile(formData.coverFile);
        if (formData.episodeImageFile) formData.episodeImageUrl = await uploadImageFile(formData.episodeImageFile);

        const payload = {
          action: "addProduct",
          sheet: TARGET_SHEET,
          seriesTitle: formData.seriesTitle,
          seriesDescription: formData.seriesDescription,
          episodeNumber: Number(formData.episodeNumber),
          titre: formData.episodeTitle,
          description: formData.content,
          categorie: formData.category,
          imageUrl: formData.cover || "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=80",
          episodeImageUrl: window.normalizeGoogleDriveImageUrl(formData.episodeImageUrl),
          urlAudio: formData.audioUrl
        };

        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok || !data || !data.success) {
          throw new Error(data?.message || `Erreur HTTP ${res.status} lors de l'enregistrement.`);
        }
        addEpisodeLocally(formData);
        showToast("Épisode ajouté avec succès dans Google Sheets !");
        closeModal();
      } catch (err) {
        console.error(err);
        showToast(`Échec de l'enregistrement : ${err.message || "vérifiez la connexion à Google Sheets."}`);

        state.isLoading = false;
        if (state.isModalOpen) {
          const submitButton = document.querySelector(".modal-card button[type='submit']");
          if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = "Publier dans Google Sheet";
          }
        }

    async function updateSeriesOrEpisode(formData) {
      const series = seriesData.find(item => item.id === state.currentSeriesId);
      const editedEpisode = series?.episodes.find(item => item.id === state.editingEpisodeId);
      const session = getUserSession();
      if (!series || !editedEpisode || !session || !isAdminUser()) {
        showToast("Session administrateur ou épisode introuvable.");
        return;
      }

      const newEpisodeNumber = Number(formData.episodeNumber);
      if (state.editingMode === "episode" && series.episodes.some(item =>
        item !== editedEpisode && item.id === newEpisodeNumber
      )) {
        showToast("Ce numéro d’épisode existe déjà dans cette série.");
        return;
      }

      const submitButton = document.querySelector(".modal-card button[type='submit']");
      try {
        state.isLoading = true;
        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = "Mise à jour...";
        }

        if (formData.coverFile) formData.cover = await uploadImageFile(formData.coverFile);
        if (state.editingMode === "episode" && formData.episodeImageFile) {
          formData.episodeImageUrl = await uploadImageFile(formData.episodeImageFile);
        }

        const episodeUpdates = state.editingMode === "series" ? series.episodes : [editedEpisode];
        for (const episode of episodeUpdates) {
          if (!episode.sheetId) {
            throw new Error(`ID Google Sheets manquant pour l’épisode ${episode.id}.`);
          }
          const updatesEpisode = state.editingMode === "episode" && episode === editedEpisode;
          const payload = {
            action: "adminUpdateProduct",
            sheet: TARGET_SHEET,
            id: episode.sheetId,
            email: session.user.email,
            token: session.token,
            seriesTitle: formData.seriesTitle,
            seriesDescription: formData.seriesDescription,
            imageUrl: formData.cover,
            categorie: formData.category,
            episodeNumber: updatesEpisode ? newEpisodeNumber : episode.id
          };
          if (updatesEpisode) {
            payload.episodeTitle = formData.episodeTitle;
            payload.episodeContent = formData.content;
            payload.urlAudio = formData.audioUrl;
            payload.episodeImageUrl = window.normalizeGoogleDriveImageUrl(formData.episodeImageUrl);
          }

          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok || !result?.success) {
            throw new Error(result?.message || `Échec de mise à jour (HTTP ${response.status}).`);
          }
        }

        series.title = formData.seriesTitle;
        series.description = formData.seriesDescription;
        series.cover = formData.cover;
        series.category = formData.category;
        if (state.editingMode === "episode") {
          editedEpisode.id = newEpisodeNumber;
          editedEpisode.title = formData.episodeTitle;
          editedEpisode.audioUrl = formData.audioUrl;
          editedEpisode.imageUrl = window.normalizeGoogleDriveImageUrl(formData.episodeImageUrl);
          editedEpisode.content = formData.content.includes("<p>")
            ? formData.content
            : `<p>${formData.content.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>")}</p>`;
          series.episodes.sort((first, second) => first.id - second.id);
        }

        showToast(state.editingMode === "series" ? "Série mise à jour." : "Épisode mis à jour.");
        closeModal();
      } catch (err) {
        console.error(err);
        showToast(`Échec de la mise à jour : ${err.message || "vérifiez la connexion à Google Sheets."}`);
      } finally {
        state.isLoading = false;
        if (state.isModalOpen && submitButton) {
          submitButton.disabled = false;
          submitButton.textContent = "Mettre à jour";
        }
      }
    }

    function readImageAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("Impossible de lire le fichier image."));
        reader.readAsDataURL(file);
      });
    }

    function addEpisodeLocally(formData) {
      let series = seriesData.find(s => s.title.toLowerCase() === formData.seriesTitle.trim().toLowerCase());
      const epNum = Number(formData.episodeNumber);
      const formattedContent = formData.content.includes("<p>") 
        ? formData.content 
        : `<p>${formData.content.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>")}</p>`;

      if (!series) {
        series = {
          id: seriesData.length + 1,
          title: formData.seriesTitle.trim(),
          category: formData.category || "Général",
          cover: formData.cover || "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=80",
          description: formData.seriesDescription.trim(),
          episodes: []
        };
        seriesData.unshift(series);
      }

      series.category = formData.category || series.category;
      series.cover = formData.cover || series.cover;
      series.description = formData.seriesDescription.trim() || series.description;
      series.episodes = series.episodes.filter(e => e.id !== epNum);
      series.episodes.push({
        id: epNum,
        title: formData.episodeTitle.trim(),
        audioUrl: formData.audioUrl,
        imageUrl: formData.episodeImageUrl || "",
        content: formattedContent
      });
      series.episodes.sort((a, b) => a.id - b.id);
    }

    /* ==========================================================================
       6. ACTIONS UTILISATEUR & MODAL

    function openModal() {

    function openSerieAdmin(action, seriesTitle, episodeNumber) {

      }
      openSerieAdmin(action, series.title);

    async function deleteSeries(seriesId) {
      if (!isAdminUser()) {
        showToast("Cette action est réservée à l’administrateur.");
        return;
      }
      const series = seriesData.find(item => item.id === Number(seriesId));
      const session = getUserSession();
      if (!series || !session?.user?.email) {
        showToast("Série ou session administrateur introuvable.");
        return;
      }
      if (!window.confirm(`Supprimer définitivement « ${series.title} » et ses ${series.episodes.length} épisode(s) ? Cette action est irréversible.`)) {
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "adminDeleteSeries",
            sheet: TARGET_SHEET,
            seriesTitle: series.title,
            email: session.user.email,
            token: session.token
          })
        });
        const result = await response.json();
        if (!response.ok || !result?.success) {
          throw new Error(result?.message || `Échec de la suppression (HTTP ${response.status}).`);
        }

        seriesData = seriesData.filter(item => item.id !== series.id);
        state.favorites = state.favorites.filter(favoriteId => favoriteId !== series.id);
        localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify(state.favorites));
        if (state.history?.seriesId === series.id) {
          state.history = null;
          localStorage.removeItem(STORAGE_KEY_HIST);
        }
        state.currentSeriesId = null;
        state.currentEpisodeId = null;
        showHome();
        showToast("Série et tous ses épisodes supprimés.");
      } catch (err) {
        console.error(err);
        showToast(`Échec de la suppression : ${err.message || "vérifiez la connexion à Google Sheets."}`);
      }
    }

    async function deleteEpisode(seriesId, episodeId) {
      if (!isAdminUser()) {
        showToast("Cette action est réservée à l’administrateur.");
        return;
      }
      const series = seriesData.find(item => item.id === Number(seriesId));
      const episode = series?.episodes.find(item => item.id === Number(episodeId));
      const session = getUserSession();
      if (!series || !episode || !episode.sheetId || !session?.user?.email) {
        showToast("Épisode ou session administrateur introuvable.");
        return;
      }
      if (!window.confirm(`Supprimer définitivement l’épisode ${episode.id} — « ${episode.title} » ?`)) {
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "adminDeleteProduct",
            sheet: TARGET_SHEET,
            id: episode.sheetId,
            email: session.user.email,
            token: session.token
          })
        });
        const result = await response.json();
        if (!response.ok || !result?.success) {
          throw new Error(result?.message || `Échec de la suppression (HTTP ${response.status}).`);
        }

        series.episodes = series.episodes.filter(item => item !== episode);
        if (!series.episodes.length) {
          seriesData = seriesData.filter(item => item !== series);
          state.favorites = state.favorites.filter(favoriteId => favoriteId !== series.id);
          localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify(state.favorites));
          if (state.history?.seriesId === series.id) {
            state.history = null;
            localStorage.removeItem(STORAGE_KEY_HIST);
          }
          state.currentSeriesId = null;
          state.currentEpisodeId = null;
          showHome();
        } else {
          showSeries(series.id);
        }
        showToast("Épisode supprimé.");
      } catch (err) {
        console.error(err);
        showToast(`Échec de la suppression : ${err.message || "vérifiez la connexion à Google Sheets."}`);
      }
    }

    function sanitizeEpisodeHTML(value) {
      const source = new DOMParser().parseFromString(String(value || ""), "text/html");
      const allowedTags = new Set(["A", "B", "BLOCKQUOTE", "BR", "DIV", "EM", "H2", "H3", "I", "LI", "OL", "P", "STRONG", "U", "UL"]);
      const blockedTags = new Set(["IFRAME", "OBJECT", "SCRIPT", "STYLE", "SVG"]);
      const output = document.createElement("div");

      function copySafeNode(node, parent) {
        if (node.nodeType === Node.TEXT_NODE) {
          parent.appendChild(document.createTextNode(node.nodeValue || ""));
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;

        const tagName = node.tagName.toUpperCase();
        if (blockedTags.has(tagName)) return;
        if (!allowedTags.has(tagName)) {
          Array.from(node.childNodes).forEach(child => copySafeNode(child, parent));
          return;
        }

        const cleanElement = document.createElement(tagName.toLowerCase());
        if (tagName === "A") {
          const href = (node.getAttribute("href") || "").trim();
          if (/^(https?:|mailto:|tel:|\/|#)/i.test(href)) cleanElement.setAttribute("href", href);
        }
        Array.from(node.childNodes).forEach(child => copySafeNode(child, cleanElement));
        parent.appendChild(cleanElement);
      }

      Array.from(source.body.childNodes).forEach(node => copySafeNode(node, output));
      return output.innerHTML.trim();
    }

    function toggleEpisodeFields() {
      const fields = document.getElementById("episode-fields");
      const button = document.getElementById("episode-fields-toggle");
      if (!fields || !button) return;
      const willShow = fields.hidden;
      fields.hidden = !willShow;
      button.setAttribute("aria-expanded", String(willShow));
      button.textContent = willShow ? "Masquer les champs" : "Afficher les champs";
    }

    function formatEpisodeText(command, value) {
      const editor = document.getElementById("episode-editor");
      if (!editor) return;
      editor.focus();
      document.execCommand(command, false, value || null);
    }

    function episodeContentHasText(html) {
      const text = new DOMParser().parseFromString(String(html || ""), "text/html").body.textContent || "";
      return text.replace(/\u00a0/g, " ").trim().length > 0;
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const form = e.target;
      if (!isAdminUser()) {
        showToast("Cette action est réservée à l’administrateur.");
        return;
      }
      const editor = document.getElementById("episode-editor");
      const contentField = form.elements.namedItem("content");
      if (editor && contentField) contentField.value = sanitizeEpisodeHTML(editor.innerHTML);
      const formData = {
        seriesTitle: form.seriesTitle.value.trim(),
        seriesDescription: form.seriesDescription.value.trim(),
        category: form.category.value.trim(),
        cover: form.cover.value.trim(),
        coverFile: form.coverFile.files[0] || null,
        episodeImageUrl: form.episodeImageUrl.value.trim(),
        episodeImageFile: form.episodeImageFile.files[0] || null,
        audioUrl: form.audioUrl.value.trim(),
        episodeNumber: form.episodeNumber.value.trim(),
        episodeTitle: form.episodeTitle.value.trim(),
        content: sanitizeEpisodeHTML(contentField?.value || "")
      };

      if (state.editingMode) {
        if (!isAdminUser()) {
          showToast("Votre session administrateur n’est plus valide.");
          return;
        }
        if (!formData.seriesTitle || !formData.seriesDescription || (!formData.cover && !formData.coverFile)) {
          if (document.getElementById("episode-fields")?.hidden) toggleEpisodeFields();
          showToast("Le titre, la description et l’image de la série sont obligatoires.");
          return;
        }
        if (state.editingMode === "episode" &&
          (!formData.episodeNumber || !formData.episodeTitle || !episodeContentHasText(formData.content))) {
          if (document.getElementById("episode-fields")?.hidden) toggleEpisodeFields();
          showToast("Le numéro, le titre et le contenu de l’épisode sont obligatoires.");
          return;
        }
        updateSeriesOrEpisode(formData);
        return;
      }

      if (!formData.seriesTitle || !formData.seriesDescription || (!formData.cover && !formData.coverFile) || !formData.episodeNumber || !formData.episodeTitle || !episodeContentHasText(formData.content)) {
        if (document.getElementById("episode-fields")?.hidden) toggleEpisodeFields();
        showToast("Remplissez les champs obligatoires et ajoutez une image ou son URL.");
        return;
      }

      submitNewEpisode(formData);
    }

    function toggleDarkMode() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      localStorage.setItem(STORAGE_KEY_THEME, state.theme);
      document.documentElement.setAttribute("data-theme", state.theme);
      renderView();
    }

    function changeFontSize(delta) {
      state.fontSize = Math.min(28, Math.max(14, state.fontSize + delta));
      localStorage.setItem(STORAGE_KEY_FONT, state.fontSize);
      document.documentElement.style.setProperty("--reader-font-size", state.fontSize + "px");
    }

    function isFavorite(seriesId) {
      return state.favorites.includes(Number(seriesId));
    }

    function toggleFavorite(seriesId) {
      const id = Number(seriesId);
      if (isFavorite(id)) {
        state.favorites = state.favorites.filter(favId => favId !== id);
        showToast("Retiré des favoris");
      } else {
        state.favorites.push(id);
        showToast("Ajouté aux favoris ♡");
      }
      localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify(state.favorites));
      renderView();
    }

    function saveHistory(seriesId, episodeId) {
      const series = seriesData.find(s => s.id === Number(seriesId));
      const episode = series?.episodes.find(e => e.id === Number(episodeId));
      if (!series || !episode) return;

      state.history = {
        seriesId: series.id,
        episodeId: episode.id,
        seriesTitle: series.title,
        episodeTitle: episode.title,
        date: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY_HIST, JSON.stringify(state.history));
    }

    function shareEpisode(seriesTitle, episodeTitle) {
      const title = `BENTOUL STORIES — ${seriesTitle} : ${episodeTitle}`;
      const url = window.location.href;

      if (navigator.share) {
        navigator.share({
          title: title,
          text: `Je lis actuellement « ${episodeTitle} » dans la série « ${seriesTitle} ». Découvre-la sans attendre !`,
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          showToast("Lien copié dans le presse-papiers !");
        }).catch(() => {
          showToast("Impossible de copier le lien.");
        });
      }
    }

    function handleScrollProgress() {
      const bar = document.getElementById("read-progress-bar");
      if (!bar) return;
      if (state.view !== "reader") {
        bar.style.width = "0%";
        return;
      }
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      bar.style.width = `${Math.min(100, Math.max(0, progress))}%`;
    }

    window.addEventListener("scroll", handleScrollProgress);

    function showHome(category = "Toutes") {
      state.view = "home";
      state.selectedCategory = category;
      window.scrollTo(0, 0);
      renderView();
    }

    function showSeries(seriesId) {
      state.view = "series";
      state.currentSeriesId = Number(seriesId);
      window.scrollTo(0, 0);
      renderView();
    }

    function showReader(seriesId, episodeId) {
      state.view = "reader";
      state.currentSeriesId = Number(seriesId);
      state.currentEpisodeId = Number(episodeId);
      saveHistory(seriesId, episodeId);
      window.scrollTo(0, 0);
      renderView();
    }

    function showSearch() {
      state.view = "search";
      window.scrollTo(0, 0);
      renderView();
    }

    function showFavorites() {
      state.view = "favorites";
      window.scrollTo(0, 0);
      renderView();
    }

    function showHistory() {
      state.view = "history";
      window.scrollTo(0, 0);
      renderView();
    }

    /* ==========================================================================
       7. MOTEUR DE RENDU (Templates)
       ========================================================================== */
    function renderView() {
      const app = document.getElementById("app");
      const bar = document.getElementById("read-progress-bar");
      if (state.view !== "reader" && bar) bar.style.width = "0%";

      let content = "";

      switch (state.view) {
        case "home":
          content = renderHomeHTML();
          break;
        case "series":
          content = renderSeriesDetailHTML();
          break;
        case "reader":
          content = renderReaderHTML();
          break;
        case "search":
          content = renderSearchHTML();
          break;
        case "favorites":
          content = renderFavoritesHTML();
          break;
        case "history":
          content = renderHistoryHTML();
          break;
      }

      app.innerHTML = content;

      if (state.view === "search") {
        const input = document.getElementById("search-input");
        if (input) {
          input.focus();
          input.value = state.searchQuery;
        }
      }
    }

    function renderHomeHTML() {
      const categories = ["Toutes", "Amour", "Drame", "Romance", "Mystère"];
      const filtered = state.selectedCategory === "Toutes"
        ? seriesData
        : seriesData.filter(s => s.category.toLowerCase() === state.selectedCategory.toLowerCase());

      return `
        <div class="fade-in home-view">
          <div class="hero">
            <h1 class="app-title">BENTOUL STORIES</h1>
            <p class="app-subtitle">Des histoires à lire, épisode après épisode.</p>
            ${state.isLiveConnected ? `<div class="badge-live">Connecté à Google Sheets</div>` : ''}
          </div>

          <div class="quick-nav">
            ${isAdminUser() ? `<button class="btn btn-primary" onclick="openSerieAdmin('newSeries')">➕ Ajouter une série</button>` : ''}
            <button class="btn btn-secondary" onclick="showSearch()">🔍 Chercher</button>
            <button class="btn btn-secondary" onclick="showFavorites()">♡ Favoris</button>
            <button class="btn btn-secondary" onclick="showHistory()">⏱ Historique</button>
            <button class="btn btn-secondary btn-icon" onclick="toggleDarkMode()">
              ${state.theme === 'dark' ? '☀️ Clair' : '🌙 Sombre'}
            </button>
          </div>

          ${state.history ? `
            <div class="resume-banner">
              <div class="resume-info">
                <h4>Reprendre la lecture</h4>
                <p>${escapeHTML(state.history.seriesTitle)} — Épisode ${state.history.episodeId}</p>
              </div>
              <button class="btn btn-primary" onclick="showReader(${state.history.seriesId}, ${state.history.episodeId})">Continuer</button>
            </div>
          ` : ''}

          <div class="category-pills">
            ${categories.map(cat => `
              <button class="pill ${state.selectedCategory === cat ? 'active' : ''}" onclick="showHome('${cat}')">
                ${cat}
              </button>
            `).join('')}
          </div>

          <div class="series-list">
            ${state.isLoading ? `
              <div class="empty-state"><p>Chargement des histoires...</p></div>
            ` : filtered.length > 0 ? filtered.map(item => `
              <article class="series-card">
                <div class="card-img-wrapper">
                  <img class="card-img" src="${item.cover}" alt="${escapeHTML(item.title)}" loading="lazy">
                  <span class="badge-cat">${escapeHTML(item.category)}</span>
                  <div class="card-image-info">
                    <h2 class="card-title">${escapeHTML(item.title)}</h2>
                    <p class="card-desc">${escapeHTML(item.description)}</p>
                  </div>
                </div>
                <div class="card-content">
                  <div class="card-footer">
                    <span class="card-episodes-count">📚 ${item.episodes.length} épisodes</span>
                    <div class="series-card-actions">
                      <button class="btn btn-primary" onclick="showSeries(${item.id})">Lire la série</button>
                      ${isAdminUser() ? `<button class="btn btn-secondary" onclick="openSeriesEditor(${item.id})">Gérer</button>` : ''}
                    </div>
                  </div>
                </div>
              </article>
            `).join('') : `
              <div class="empty-state">
                <p>Aucune histoire trouvée.</p>
                ${isAdminUser() ? `<button class="btn btn-primary" onclick="openSerieAdmin('newSeries')">Ajouter le premier épisode</button>` : ''}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderSeriesDetailHTML() {
      const series = seriesData.find(s => s.id === state.currentSeriesId);
      if (!series) {
        return `<div class="empty-state"><p>Série introuvable.</p><button class="btn btn-primary" onclick="showHome()">← Accueil</button></div>`;
      }

      const fav = isFavorite(series.id);
      const firstEpisode = series.episodes[0] || null;

      return `
        <div class="fade-in">
          <div class="series-detail-toolbar">
            <button class="btn btn-secondary" onclick="showHome()">← Retour</button>
            <div class="series-detail-actions">
              ${isAdminUser() ? `<button class="btn btn-secondary" onclick="openSeriesEditor(${series.id})">✏️ Gérer la série</button>` : ''}
              ${isAdminUser() ? `<button class="btn btn-primary" onclick="openSerieAdminForCurrent('addEpisode')">➕ Ajouter un épisode</button>` : ''}
              <button class="btn btn-secondary" onclick="toggleFavorite(${series.id})">
                ${fav ? '♥ Retirer' : '♡ Favoris'}
              </button>
            </div>
          </div>

          <div class="detail-hero">
            <img class="detail-cover" src="${series.cover}" alt="${escapeHTML(series.title)}">
            <div class="detail-hero-content">
              <h1 class="detail-title">${escapeHTML(series.title)}</h1>
              <div class="detail-meta">
                <span>🏷️ ${escapeHTML(series.category)}</span>
                <span>•</span>
                <span>📖 ${series.episodes.length} épisodes</span>
              </div>
              <p class="detail-desc">${escapeHTML(series.description)}</p>
              ${firstEpisode ? `<button class="btn btn-primary" onclick="showReader(${series.id}, ${firstEpisode.id})">▶ Lire le premier épisode</button>` : ''}
            </div>
          </div>

          <div class="section-heading">
            <span>Épisodes</span>
          </div>

          <div class="episode-list">
            ${series.episodes.map(ep => `
              <div class="episode-card">
                ${ep.imageUrl ? `<img class="episode-card-image" src="${escapeHTML(ep.imageUrl)}" alt="Image de l’épisode ${ep.id}" loading="lazy">` : ''}
                <div>
                  <div class="episode-number">Épisode ${ep.id}</div>
                  <div class="episode-title">${escapeHTML(ep.title)}</div>
                </div>
                <div class="episode-card-actions">
                  <button class="btn btn-primary" onclick="showReader(${series.id}, ${ep.id})">LIRE</button>
                  ${isAdminUser() ? `<button class="btn btn-secondary" onclick="openEpisodeEditor(${series.id}, ${ep.id})">Modifier</button>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderReaderHTML() {
      const series = seriesData.find(s => s.id === state.currentSeriesId);
      const episode = series?.episodes.find(e => e.id === state.currentEpisodeId);

      if (!series || !episode) {
        return `<div class="empty-state"><p>Épisode introuvable.</p><button class="btn btn-primary" onclick="showHome()">← Accueil</button></div>`;
      }

      const currentIndex = series.episodes.findIndex(e => e.id === episode.id);
      const prevEpisode = series.episodes[currentIndex - 1] || null;
      const nextEpisode = series.episodes[currentIndex + 1] || null;
      const fav = isFavorite(series.id);

      return `
        <div class="reader-view fade-in">
          <div class="reader-toolbar">
            <button class="btn btn-secondary" onclick="showSeries(${series.id})">← Épisodes</button>
            
            <div class="reader-actions">
              <button class="btn btn-secondary btn-icon" onclick="changeFontSize(-2)">A−</button>
              <button class="btn btn-secondary btn-icon" onclick="changeFontSize(2)">A+</button>
              <button class="btn btn-secondary btn-icon" onclick="toggleDarkMode()">
                ${state.theme === 'dark' ? '☀️' : '🌙'}
              </button>
            </div>
          </div>

          <div class="reader-header">
            <div class="reader-series-title">${escapeHTML(series.title)}</div>
            <div class="reader-episode-num">Épisode ${episode.id}</div>
            <h1 class="reader-episode-title">« ${escapeHTML(episode.title)} »</h1>
          </div>

          ${episode.imageUrl ? `<img class="reader-episode-image" src="${escapeHTML(episode.imageUrl)}" alt="Image de l’épisode ${episode.id}" loading="lazy">` : ''}

          <article class="reader-content">
            ${episode.content}
          </article>
          ${episode.audioUrl ? `<audio class="episode-audio" controls preload="metadata" src="${escapeHTML(episode.audioUrl)}">Votre navigateur ne prend pas en charge la lecture audio.</audio>` : ''}

          <div class="reader-extra-actions">
            <button class="btn btn-secondary" onclick="toggleFavorite(${series.id})">
              ${fav ? '♥ Favori' : '♡ Favori'}
            </button>
            <button class="btn btn-secondary" onclick="shareEpisode('${escapeHTML(series.title)}', '${escapeHTML(episode.title)}')">
              📤 Partager
            </button>
          </div>

          <div class="reader-navigation">
            <button class="btn btn-secondary" 
                    ${!prevEpisode ? 'disabled' : ''} 
                    onclick="${prevEpisode ? `showReader(${series.id}, ${prevEpisode.id})` : ''}">
              ← Précédent
            </button>

            ${nextEpisode ? `<button class="btn btn-primary" onclick="showReader(${series.id}, ${nextEpisode.id})">Suivant →</button>` : ''}
          </div>
        </div>
      `;
    }

    function renderSearchHTML() {
      const q = (state.searchQuery || "").trim().toLowerCase();
      let results = [];

      if (q.length > 0) {
        seriesData.forEach(series => {
          const matchSeries = series.title.toLowerCase().includes(q) || series.category.toLowerCase().includes(q);
          const matchingEpisodes = series.episodes.filter(ep => ep.title.toLowerCase().includes(q));

          if (matchSeries) {
            results.push({ type: 'series', data: series });
          }
          matchingEpisodes.forEach(ep => {
            results.push({ type: 'episode', series: series, episode: ep });
          });
        });
      }

      return `
        <div class="fade-in">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <button class="btn btn-secondary" onclick="showHome()">← Retour</button>
            <h2 style="font-size:1.1rem; font-weight:700;">Recherche</h2>
          </div>

          <div class="search-input-wrapper">
            <input type="search" 
                   id="search-input" 
                   class="search-input" 
                   placeholder="Rechercher une histoire, catégorie, épisode..."
                   oninput="handleSearchInput(event)">
          </div>

          <div class="series-list">
            ${q.length === 0 ? `
              <div class="empty-state"><p>Tapez un mot-clé pour lancer la recherche.</p></div>
            ` : results.length > 0 ? results.map(res => {
              if (res.type === 'series') {
                return `
                  <div class="episode-card">
                    <div>
                      <span class="badge-cat" style="position:static; margin-bottom:4px; display:inline-block;">Série</span>
                      <div class="episode-title">${escapeHTML(res.data.title)} (${escapeHTML(res.data.category)})</div>
                    </div>
                    <button class="btn btn-primary" onclick="showSeries(${res.data.id})">Ouvrir</button>
                  </div>
                `;
              } else {
                return `
                  <div class="episode-card">
                    <div>
                      <span class="badge-cat" style="position:static; margin-bottom:4px; display:inline-block; background:var(--primary);">Épisode</span>
                      <div class="episode-title">${escapeHTML(res.episode.title)}</div>
                      <div class="episode-number">${escapeHTML(res.series.title)} — Épisode ${res.episode.id}</div>
                    </div>
                    <button class="btn btn-primary" onclick="showReader(${res.series.id}, ${res.episode.id})">Lire</button>
                  </div>
                `;
              }
            }).join('') : `
              <div class="empty-state"><p>Aucun résultat pour « ${escapeHTML(q)} ».</p></div>
            `}
          </div>
        </div>
      `;
    }

    function handleSearchInput(e) {
      state.searchQuery = e.target.value;
      renderView();
    }

    function renderFavoritesHTML() {
      const favSeries = seriesData.filter(s => isFavorite(s.id));

      return `
        <div class="fade-in">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <button class="btn btn-secondary" onclick="showHome()">← Accueil</button>
            <h2 style="font-size:1.15rem; font-weight:700;">Mes favoris (${favSeries.length})</h2>
          </div>

          <div class="series-list">
            ${favSeries.length > 0 ? favSeries.map(item => `
              <div class="episode-card">
                <div>
                  <div class="episode-title">${escapeHTML(item.title)}</div>
                  <div class="episode-number">${escapeHTML(item.category)} • ${item.episodes.length} épisodes</div>
                </div>
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-secondary" onclick="toggleFavorite(${item.id})">Retirer</button>
                  <button class="btn btn-primary" onclick="showSeries(${item.id})">Lire</button>
                </div>
              </div>
            `).join('') : `
              <div class="empty-state">
                <p>Vous n'avez encore ajouté aucune histoire.</p>
                <button class="btn btn-primary" onclick="showHome()">Découvrir des séries</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderHistoryHTML() {
      const hist = state.history;

      return `
        <div class="fade-in">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <button class="btn btn-secondary" onclick="showHome()">← Accueil</button>
            <h2 style="font-size:1.15rem; font-weight:700;">Historique</h2>
          </div>

          ${hist ? `
            <div class="series-card" style="padding: 20px;">
              <div style="margin-bottom: 14px;">
                <span class="badge-cat" style="position:static; margin-bottom:8px; display:inline-block;">Dernière lecture</span>
                <h3 style="font-size:1.25rem; font-weight:700;">${escapeHTML(hist.seriesTitle)}</h3>
                <p style="color:var(--text-muted); font-size:0.95rem; margin-top:4px;">
                  Épisode ${hist.episodeId} — ${escapeHTML(hist.episodeTitle)}
                </p>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">
                  Lu le : ${new Date(hist.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}
                </div>
              </div>
              <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="showReader(${hist.seriesId}, ${hist.episodeId})">Continuer la lecture</button>
                <button class="btn btn-secondary" onclick="showSeries(${hist.seriesId})">Voir la série</button>
              </div>
            </div>
          ` : `
            <div class="empty-state">
              <p>Aucun historique de lecture enregistré.</p>
              <button class="btn btn-primary" onclick="showHome()">Commencer une histoire</button>
            </div>
          `}
        </div>
      `;
    }

    // Modal : Formulaire d'ajout dans Google Sheet
    function renderAddModalHTML() {
      const currentSeries = state.view === "series"
        ? seriesData.find(series => series.id === state.currentSeriesId)
        : null;
      const currentEpisode = currentSeries && state.editingMode
        ? currentSeries.episodes.find(episode => episode.id === state.editingEpisodeId)
        : null;
      const isEditing = Boolean(state.editingMode);
      const editingSeriesOnly = state.editingMode === "series";
      return `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal-card fade-in">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
              <h2 style="font-size:1.25rem; font-weight:700;">${isEditing ? (editingSeriesOnly ? "Modifier la série" : "Modifier l’épisode") : currentSeries ? "Ajouter un épisode" : "Créer une série et son premier épisode"}</h2>
              <button class="btn btn-secondary btn-icon" onclick="closeModal()">✕</button>
            </div>

            <form novalidate onsubmit="handleFormSubmit(event)">
              <button id="episode-fields-toggle" type="button" class="btn btn-secondary episode-fields-toggle" aria-controls="episode-fields" aria-expanded="false" onclick="toggleEpisodeFields()">Afficher les champs</button>
              <div id="episode-fields" hidden>
                <h3 class="form-section-title">Informations de la série</h3>
                <div class="form-group">
                  <label for="series-title">Titre de la série *</label>
                  <input id="series-title" type="text" name="seriesTitle" class="form-control" placeholder="ex: Entre nous deux" value="${escapeHTML(currentSeries?.title || '')}">
                </div>

                <div class="form-group">
                  <label for="series-description">Description courte de la série *</label>
                  <textarea id="series-description" name="seriesDescription" rows="3" class="form-control" placeholder="Présentez brièvement l'histoire...">${escapeHTML(currentSeries?.description || '')}</textarea>
                </div>

                <div class="form-group">
                  <label for="series-cover">URL de l'image de la série</label>
                  <input id="series-cover" type="url" name="cover" class="form-control" placeholder="https://..." value="${escapeHTML(currentSeries?.cover || '')}">
                  <label for="series-cover-file" style="margin-top:10px;">Ou importer une image</label>
                  <input id="series-cover-file" type="file" name="coverFile" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
                  <small style="display:block; color:var(--text-muted); margin-top:6px;">JPG, PNG, GIF ou WEBP — 3 Mo maximum.</small>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                  <div class="form-group">
                    <label for="series-category">Catégorie *</label>
                    <select id="series-category" name="category" class="form-control">
                      ${["Amour", "Drame", "Romance", "Mystère", "Général"].map(category => `
                        <option value="${category}" ${category === (currentSeries?.category || "Amour") ? "selected" : ""}>${category}</option>
                      `).join('')}
                    </select>
                  </div>
                  <div class="form-group" ${editingSeriesOnly ? 'hidden' : ''}>
                    <label for="episode-number">Numéro de l'épisode *</label>
                    <input id="episode-number" type="number" name="episodeNumber" min="1" class="form-control" placeholder="1" value="${currentEpisode ? currentEpisode.id : ''}" ${editingSeriesOnly ? 'disabled' : ''}>
                  </div>
                </div>

                ${editingSeriesOnly ? `<p class="form-section-title">Les informations de la série seront mises à jour sur tous ses épisodes.</p>` : `<h3 class="form-section-title">${isEditing ? "Informations de l’épisode" : "Nouvel épisode"}</h3>`}
                <div class="form-group" ${editingSeriesOnly ? 'hidden' : ''}>
                  <label for="episode-title">Titre de l'épisode *</label>
                  <input id="episode-title" type="text" name="episodeTitle" class="form-control" placeholder="ex: La rencontre" value="${escapeHTML(currentEpisode?.title || '')}" ${editingSeriesOnly ? 'disabled' : ''}>
                </div>

                <div class="form-group" ${editingSeriesOnly ? 'hidden' : ''}>
                  <label for="episode-image-url">URL de l'image de l'épisode (facultatif)</label>
                  <input id="episode-image-url" type="url" name="episodeImageUrl" class="form-control" placeholder="https://..." value="${escapeHTML(currentEpisode?.imageUrl || '')}" ${editingSeriesOnly ? 'disabled' : ''}>
                  <label for="episode-image-file" style="margin-top:10px;">Ou importer une image pour cet épisode</label>
                  <input id="episode-image-file" type="file" name="episodeImageFile" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp" ${editingSeriesOnly ? 'disabled' : ''}>
                  <small style="display:block; color:var(--text-muted); margin-top:6px;">Facultatif — JPG, PNG, GIF ou WEBP, 3 Mo maximum. L’image est enregistrée dans la colonne imageEpisode.</small>
                </div>

                <div class="form-group" ${editingSeriesOnly ? 'hidden' : ''}>
                  <label for="episode-audio">URL audio de l'épisode (facultatif)</label>
                  <input id="episode-audio" type="url" name="audioUrl" class="form-control" placeholder="https://..." value="${escapeHTML(currentEpisode?.audioUrl || '')}" ${editingSeriesOnly ? 'disabled' : ''}>
                  <small style="display:block; color:var(--text-muted); margin-top:6px;">Cette URL est enregistrée dans la colonne UrlRedirection.</small>
                </div>
              </div>

              ${editingSeriesOnly ? "" : `
                <div class="form-group">
                  <label for="episode-editor">Histoire de l'épisode *</label>
                  <div class="episode-editor-toolbar" role="toolbar" aria-label="Mise en forme de l'histoire">
                    <button type="button" aria-label="Gras" title="Gras" onmousedown="event.preventDefault()" onclick="formatEpisodeText('bold')"><strong>G</strong></button>
                    <button type="button" aria-label="Italique" title="Italique" onmousedown="event.preventDefault()" onclick="formatEpisodeText('italic')"><em>I</em></button>
                    <button type="button" aria-label="Souligné" title="Souligné" onmousedown="event.preventDefault()" onclick="formatEpisodeText('underline')"><u>S</u></button>
                    <button type="button" aria-label="Titre" title="Titre" onmousedown="event.preventDefault()" onclick="formatEpisodeText('formatBlock', 'h2')">Titre</button>
                    <button type="button" aria-label="Liste à puces" title="Liste à puces" onmousedown="event.preventDefault()" onclick="formatEpisodeText('insertUnorderedList')">• Liste</button>
                    <button type="button" aria-label="Liste numérotée" title="Liste numérotée" onmousedown="event.preventDefault()" onclick="formatEpisodeText('insertOrderedList')">1. Liste</button>
                    <button type="button" aria-label="Annuler" title="Annuler" onmousedown="event.preventDefault()" onclick="formatEpisodeText('undo')">↶</button>
                    <button type="button" aria-label="Rétablir" title="Rétablir" onmousedown="event.preventDefault()" onclick="formatEpisodeText('redo')">↷</button>
                  </div>
                  <div id="episode-editor" class="episode-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Histoire de l'épisode">${sanitizeEpisodeHTML(currentEpisode?.content || "")}</div>
                  <textarea id="episode-content" name="content" hidden aria-hidden="true">${escapeHTML(currentEpisode?.content || '')}</textarea>
                </div>
              `}

              <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Annuler</button>
                <button type="submit" class="btn btn-primary" ${state.isLoading ? 'disabled' : ''}>
                  ${state.isLoading ? (isEditing ? 'Mise à jour...' : 'Enregistrement...') : isEditing ? 'Mettre à jour' : 'Publier dans Google Sheet'}
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ==========================================================================
       8. DÉMARRAGE
       ========================================================================== */
    Object.assign(window, {
      changeFontSize,
      handleSearchInput,
      openSerieAdmin,
      openSerieAdminForCurrent,
      openEpisodeEditor,
      openSeriesEditor,
      shareEpisode,
      showFavorites,
      showHistory,
      showHome,
      showReader,
      showSearch,
      showSeries,
      toggleDarkMode,
      toggleFavorite
    });

    window.addEventListener("DOMContentLoaded", () => {
      renderView();
      loadSeriesFromSheets();
    });
    })();
  </script>
</body>
</html>
