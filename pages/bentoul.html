<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique — BENTOUL</title>
    <style>
      .layout:has(.catalog-heading) {
        grid-template-columns: 250px minmax(0, 1fr);
        width: min(96%, 1440px);
        min-width: 0;
      }

      main:has(.catalog-heading) {
        width: 100%;
        max-width: none;
        min-width: 0;
        padding: clamp(1.25rem, 3vw, 2.5rem);
      }

      .catalog-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1.5rem;
        margin-bottom: 1.75rem;
      }

      .catalog-eyebrow {
        margin: 0 0 0.5rem;
        color: #2563eb;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .catalog-heading h2 {
        margin: 0;
        color: #0f172a;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        letter-spacing: -0.05em;
      }

      .catalog-heading p {
        max-width: 540px;
        margin: 0.6rem 0 0;
        color: #64748b;
        line-height: 1.65;
      }

      .catalog-search {
        width: min(100%, 300px);
        min-height: 44px;
        padding: 0.7rem 0.9rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.7rem;
        color: #172033;
        background: #fff;
        font: inherit;
      }

      .catalog-search:focus {
        border-color: #3b82f6;
        outline: 3px solid rgb(59 130 246 / 16%);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .catalog-status {
        margin: 0 0 1rem;
        color: #64748b;
        font-size: 0.9rem;
      }

      .catalog-status[data-state="error"] {
        color: #b91c1c;
      }

      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
        gap: 1rem;
      }

      .product-card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 5px 18px rgb(15 23 42 / 4%);
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .product-card:hover {
        transform: translateY(-3px);
        border-color: #cbdaf0;
        box-shadow: 0 14px 28px rgb(15 23 42 / 8%);
      }

      .product-image-wrap {
        position: relative;
        display: grid;
        height: 190px;
        overflow: hidden;
        place-items: center;
        background: linear-gradient(145deg, #eff6ff, #f8fafc);
      }

      .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .product-image-fallback {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        border: 1px solid #dbeafe;
        border-radius: 1.25rem;
        color: #2563eb;
        background: #fff;
        box-shadow: 0 8px 20px rgb(37 99 235 / 10%);
        font-size: 1.5rem;
        font-weight: 700;
      }

      .product-category {
        position: absolute;
        top: 0.75rem;
        left: 0.75rem;
        max-width: calc(100% - 1.5rem);
        overflow: hidden;
        padding: 0.35rem 0.6rem;
        border: 1px solid rgb(255 255 255 / 80%);
        border-radius: 999px;
        color: #334155;
        background: rgb(255 255 255 / 90%);
        font-size: 0.72rem;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
        backdrop-filter: blur(8px);
      }

      .product-content {
        display: flex;
        min-height: 178px;
        flex-direction: column;
        padding: 1rem;
      }

      .product-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin-top: 0.85rem;
      }

      .product-action {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 0.5rem 0.6rem;
        border: 1px solid #dbe3ef;
        border-radius: 0.6rem;
        color: #334155;
        background: #fff;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
      }

      .product-action:hover {
        border-color: #bfdbfe;
        color: #1d4ed8;
        background: #f8fafc;
      }

      .product-action-primary {
        grid-column: 1 / -1;
        border-color: #1d4ed8;
        color: #fff;
        background: #1d4ed8;
      }

      .product-action-details {
        grid-column: 1 / -1;
      }

      .product-action-primary:hover {
        border-color: #1e40af;
        color: #fff;
        background: #1e40af;
      }

      .product-action[disabled] {
        border-color: #e2e8f0;
        color: #94a3b8;
        background: #f1f5f9;
        cursor: not-allowed;
      }

      .product-owned {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        color: #15803d;
        font-size: 0.76rem;
        font-weight: 700;
      }

      .product-content h3 {
        display: -webkit-box;
        overflow: hidden;
        margin: 0;
        color: #172033;
        font-size: 1rem;
        line-height: 1.4;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .product-description {
        display: -webkit-box;
        overflow: hidden;
        margin: 0.55rem 0 1rem;
        color: #64748b;
        font-size: 0.84rem;
        line-height: 1.6;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .product-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: auto;
        padding-top: 0.75rem;
        border-top: 1px solid #f1f5f9;
      }

      .product-price {
        color: #c2410c;
        font-size: 0.9rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .product-likes {
        color: #94a3b8;
        font-size: 0.78rem;
      }

      .catalog-empty {
        grid-column: 1 / -1;
        padding: 3rem 1rem;
        border: 1px dashed #cbd5e1;
        border-radius: 1rem;
        color: #64748b;
        text-align: center;
        background: #fff;
      }

      .product-details {
        padding: clamp(1rem, 3vw, 2rem);
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 8px 28px rgb(15 23 42 / 5%);
      }

      .details-back {
        margin-bottom: 1.25rem;
      }

      .details-layout {
        display: grid;
        grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
        gap: clamp(1.25rem, 4vw, 3rem);
      }

      .details-image-wrap {
        position: relative;
        display: grid;
        min-height: 300px;
        overflow: hidden;
        place-items: center;
        border-radius: 0.85rem;
        background: linear-gradient(145deg, #eff6ff, #f8fafc);
      }

      .details-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .details-image-placeholder {
        color: #2563eb;
        font-size: 3rem;
        font-weight: 800;
      }

      .details-copy h2 {
        margin: 0.75rem 0;
        color: #0f172a;
        font-size: clamp(1.5rem, 3vw, 2rem);
        letter-spacing: -0.04em;
      }

      .details-description {
        color: #526176;
        line-height: 1.75;
        white-space: pre-line;
      }

      .details-credit-panel {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 1.25rem 0;
      }

      .details-credit {
        padding: 0.85rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.7rem;
        background: #f8fafc;
      }

      .details-credit span {
        display: block;
        margin-bottom: 0.3rem;
        color: #64748b;
        font-size: 0.75rem;
      }

      .details-credit strong {
        color: #c2410c;
        font-size: 1rem;
      }

      .catalog-dialog {
        width: min(92vw, 560px);
        max-height: min(88vh, 820px);
        padding: 0;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        color: #172033;
        background: #fff;
        box-shadow: 0 24px 80px rgb(15 23 42 / 28%);
      }

      .catalog-dialog::backdrop {
        background: rgb(15 23 42 / 60%);
        backdrop-filter: blur(3px);
      }

      .dialog-content {
        padding: 1.5rem;
      }

      .dialog-content h2 {
        margin: 0 0 0.5rem;
        color: #0f172a;
        font-size: 1.35rem;
      }

      .dialog-description {
        margin: 0;
        color: #64748b;
        line-height: 1.6;
      }

      .purchase-product-title {
        color: #0f172a;
        font-weight: 700;
      }

      .purchase-summary {
        display: grid;
        gap: 0.7rem;
        margin: 1.25rem 0;
        padding: 1rem;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        background: #f8fafc;
      }

      .purchase-summary-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: #475569;
        font-size: 0.9rem;
      }

      .purchase-summary-row strong {
        color: #172033;
        text-align: right;
      }

      .purchase-summary-row-total {
        padding-top: 0.7rem;
        border-top: 1px solid #e2e8f0;
        font-weight: 700;
      }

      .dialog-message {
        min-height: 1.25rem;
        margin: 0.75rem 0;
        color: #475569;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .dialog-message[data-state="error"] {
        color: #b91c1c;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.65rem;
        margin-top: 1.25rem;
      }

      .dialog-button {
        min-height: 42px;
        padding: 0.65rem 0.9rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.65rem;
        color: #334155;
        background: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .dialog-button-primary {
        border-color: #1d4ed8;
        color: #fff;
        background: #1d4ed8;
      }

      .dialog-button-primary:hover {
        border-color: #1e40af;
        background: #1e40af;
      }

      .dialog-button[disabled] {
        border-color: #e2e8f0;
        color: #94a3b8;
        background: #f1f5f9;
        cursor: not-allowed;
      }

      .document-viewer {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 0.75rem;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: max(0.75rem, env(safe-area-inset-top))
          max(0.75rem, env(safe-area-inset-right))
          max(0.75rem, env(safe-area-inset-bottom))
          max(0.75rem, env(safe-area-inset-left));
        background: #f4f6fa;
      }

      .document-viewer[hidden] {
        display: none;
      }

      body.document-viewer-open {
        overflow: hidden;
      }

      .document-viewer-header {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        min-width: 0;
      }

      .document-viewer-header .dialog-button {
        flex: 0 0 auto;
      }

      .document-viewer-header h2 {
        overflow: hidden;
        margin: 0;
        min-width: 0;
        color: #0f172a;
        font-size: clamp(1rem, 3vw, 1.25rem);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .document-viewer-frame {
        width: 100%;
        height: 100%;
        min-height: 0;
        align-self: stretch;
        border: 1px solid #e2e8f0;
        border-radius: 0.65rem;
        background: #f1f5f9;
      }

      @media (max-width: 900px) {
        .layout:has(.catalog-heading) {
          width: 100%;
        }
      }

      @media (max-width: 640px) {
        .layout:has(.catalog-heading) {
          grid-template-columns: 1fr;
        }

        main:has(.catalog-heading) {
          padding: 0.75rem;
        }

        .catalog-heading {
          align-items: stretch;
          flex-direction: column;
          gap: 1rem;
        }

        .catalog-search {
          width: 100%;
        }

        .catalog-grid {
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr));
          gap: 0.65rem;
        }

        .product-card {
          border-radius: 0.8rem;
        }

        .product-image-wrap {
          height: clamp(150px, 45vw, 220px);
        }

        .product-image {
          object-fit: contain;
        }

        .product-image-fallback {
          width: 42px;
          height: 42px;
          border-radius: 0.85rem;
          font-size: 1.1rem;
        }

        .product-category {
          top: 0.35rem;
          left: 0.35rem;
          max-width: calc(100% - 0.7rem);
          padding: 0.2rem 0.35rem;
          font-size: 0.58rem;
        }

        .product-content {
          min-height: 0;
          padding: 0.6rem;
        }

        .product-content h3 {
          font-size: 0.78rem;
          line-height: 1.3;
        }

        .product-description {
          margin: 0.35rem 0 0.55rem;
          font-size: 0.68rem;
          line-height: 1.4;
        }

        .product-meta {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.25rem;
          padding-top: 0.5rem;
        }

        .product-price,
        .product-owned {
          font-size: 0.68rem;
        }

        .product-actions {
          grid-template-columns: minmax(0, 1fr);
          gap: 0.35rem;
          margin-top: 0.55rem;
        }

        .product-action,
        .product-action-details {
          grid-column: 1;
          min-height: 34px;
          padding: 0.35rem 0.25rem;
          font-size: 0.68rem;
          line-height: 1.2;
        }

        .details-layout {
          grid-template-columns: 1fr;
        }

        .details-image-wrap {
          min-height: 220px;
        }

        .dialog-content {
          padding: 1.15rem;
        }

        .dialog-actions {
          flex-direction: column-reverse;
        }

        .dialog-button {
          width: 100%;
        }
      }
    </style>
    <script>
      window.APP_CONFIG = {
        apiUrl: "https://script.google.com/macros/s/AKfycbyhySTDcQdaUualr_r_r-BZy5g-r_xLDnEsjIkLno9TUaJ1uyp80Wr9dzH28YinnBqlcQ/exec"
      };
    </script>
    <script src="../app.js" defer></script>
    <script src="bentoul.js" defer></script>
  </head>
  <body>
    <main id="accueil">
      <section id="catalog-section" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <div>
            <p class="catalog-eyebrow">Boutique BENTOUL</p>
            <h2 id="catalog-title">Découvrez nos produits</h2>
            <p>Une sélection de ressources et de contenus à explorer, préparée pour vous.</p>
          </div>
          <label>
            <span class="visually-hidden">Rechercher un produit</span>
            <input class="catalog-search" id="product-search" type="search" placeholder="Rechercher un produit…" autocomplete="off" />
          </label>
        </div>
        <p class="catalog-status" id="catalog-status" role="status" aria-live="polite">Chargement des produits…</p>
        <div class="catalog-grid" id="catalog-grid" aria-busy="true"></div>
      </section>
    </main>
  </body>
</html>
