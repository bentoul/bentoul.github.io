<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="theme-color" content="#2563eb">
<title>Éditeur BENTOUL CREATION</title>

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
    margin:0;padding:15px;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif;
    height:100vh;
    height:100dvh;
    overflow:hidden
}
.app{
    max-width:1100px;margin:0 auto;width:100%;height:100%;
    display:flex;flex-direction:column;min-height:0
}
h2{font-size:21px;margin:0 0 15px}
.setting{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:12px;flex-shrink:0}
.setting select,.setting input{
    min-width:0;width:100%;height:42px;padding:0 10px;
    border:1px solid #d5dce8;border-radius:8px;background:#fff;outline:none
}
.setting select:focus,.setting input:focus{border-color:#2563eb}
#serie,#episode{flex:1}
#NomSerie,#titre{flex:1.3}
#statut{flex:.8}

.toolbar{
    display:flex;flex-wrap:wrap;gap:5px;padding:9px;background:#fff;
    border:1px solid #d5dce8;border-radius:10px 10px 0 0;
    flex-shrink:0
}
.toolbar button,.toolbar select,.toolbar input[type="color"]{
    height:34px;min-width:34px;padding:0 9px;border:1px solid #e2e8f0;
    border-radius:6px;background:#f8fafc;cursor:pointer
}
.toolbar button:hover{background:#dbeafe}
.toolbar button.is-active{background:#bfdbfe;border-color:#60a5fa;color:#1d4ed8}
.toolbar button svg{display:block;margin:0 auto}
.toolbar select#fontFamily{max-width:128px}
.toolbar select#fontSize{max-width:92px}
.toolbar .separator{width:1px;background:#d5dce8;margin:2px 4px}

.editor{
    display:block;width:100%;
    flex:1 1 0;
    min-height:0;
    padding:20px;
    background:#fff;border:1px solid #d5dce8;border-top:0;
    border-radius:0 0 10px 10px;outline:none;line-height:1.8;
    overflow-wrap:anywhere;white-space:normal;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch
}
.editor:focus{box-shadow:inset 0 0 0 1px #93c5fd}
.editor img{max-width:100%;height:auto;border-radius:8px;margin:8px 0}
.editor:empty:before{
    content:"Commence à écrire le contenu ici...";
    color:#94a3b8;pointer-events:none
}
.hidden{display:none!important}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;flex-shrink:0}
.btn{border:0;padding:11px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-primary{background:#2563eb;color:white}
.btn-secondary{background:#e2e8f0;color:#172033}
.btn:disabled{opacity:.6;cursor:wait}

#message{
    position: fixed;top: 50%;left: 50%;transform: translateX(-50%);
    display:none;margin:12px 0;padding:12px;border-radius:8px;
    font-size:14px;overflow-wrap:anywhere;
    cursor:pointer;
    touch-action:manipulation
}
#message.success{display:block;background:#dcfce7;color:#166534}
#message.error{display:block;background:#fee2e2;color:#991b1b}
#message.info{display:block;background:#dbeafe;color:#1e40af}

@media(max-width:700px){
    body{padding:10px}
    .setting{flex-wrap:wrap;margin-bottom:8px}
    .setting #serie,
    .setting #episode,
    .setting #NomSerie,
    .setting #titre,
    .setting #statut{flex:1 1 calc(50% - 8px)}
    .toolbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:6px}
    .toolbar>*{flex:0 0 auto}
    .editor{padding:14px}
    .actions{margin-top:8px}
    .actions .btn{flex:1}
}
</style>
</head>

<body>
<div class="app">

    <div id="message" role="status" aria-live="polite"></div>

    <div class="setting">
        <select id="serie" aria-label="Sélectionner une série">
            <option value="">➕ Nouvelle série</option>
        </select>

        <input type="text" id="NomSerie"
               placeholder="Nom de la série"
               aria-label="Nom de la série">

        <select id="episode" aria-label="Sélectionner un épisode" disabled>
            <option value="">Sélectionne d'abord une série</option>
        </select>

        <input type="text" id="titre"
               class="hidden"
               placeholder="Titre de l'épisode"
               aria-label="Titre de l'épisode">

        <select id="statut" aria-label="Statut du contenu">
            <option value="Publié">Publié</option>
            <option value="Brouillon">Brouillon</option>
        </select>
    </div>

    <div class="toolbar" id="richToolbar">
        <button type="button" data-command="bold" title="Gras" aria-label="Gras" aria-pressed="false"><b>G</b></button>
        <button type="button" data-command="italic" title="Italique" aria-label="Italique" aria-pressed="false"><i>I</i></button>
        <button type="button" data-command="underline" title="Souligné" aria-label="Souligné" aria-pressed="false"><u>S</u></button>

        <span class="separator"></span>

        <select id="fontFamily" aria-label="Police du texte" title="Police du texte">
            <option value="">Police</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="Verdana, sans-serif">Verdana</option>
            <option value="Tahoma, sans-serif">Tahoma</option>
            <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
            <option value="Impact, sans-serif">Impact</option>
            <option value="Garamond, serif">Garamond</option>
        </select>

        <select id="fontSize" aria-label="Taille du texte" title="Taille du texte">
            <option value="">Taille</option>
            <option value="1">10 px</option>
            <option value="2">13 px</option>
            <option value="3">16 px</option>
            <option value="4">18 px</option>
            <option value="5">24 px</option>
            <option value="6">32 px</option>
            <option value="7">48 px</option>
        </select>

        <span class="separator"></span>

        <button type="button" data-command="justifyLeft" title="Aligner à gauche" aria-label="Aligner à gauche" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h8"/></svg>
        </button>
        <button type="button" data-command="justifyCenter" title="Centrer" aria-label="Centrer" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h12M4 6.5h8M2 9.5h12M4 12.5h8"/></svg>
        </button>
        <button type="button" data-command="justifyRight" title="Aligner à droite" aria-label="Aligner à droite" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h12M6 6.5h8M2 9.5h12M6 12.5h8"/></svg>
        </button>
        <button type="button" data-command="justifyFull" title="Justifier" aria-label="Justifier" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h12M2 6.5h12M2 9.5h12M2 12.5h12"/></svg>
        </button>

        <span class="separator"></span>

        <select id="formatBlock" aria-label="Format du texte">
            <option value="p">Paragraphe</option>
            <option value="h1">Titre 1</option>
            <option value="h2">Titre 2</option>
            <option value="h3">Titre 3</option>
            <option value="blockquote">Citation</option>
        </select>

        <button type="button" id="listBtn">• Liste</button>
        <button type="button" id="linkBtn">🔗 Lien</button>
        <button type="button" id="imageBtn">🖼 Image</button>

        <input type="color" id="textColor" value="#172033" title="Couleur du texte">
        <input type="color" id="highlightColor" value="#fff59d" title="Surbrillance">

        <button type="button" id="undoBtn" title="Annuler">↶</button>
        <button type="button" id="redoBtn" title="Rétablir">↷</button>

        <button type="button" id="cleanTextBtn" title="Supprimer toutes les balises HTML">
  🧹</button>
            <button type="button" id="toggleViewHtml" title="Basculer entre éditeur texte et HTML">
    &lt;/&gt; Voir HTML
</button>

        <input type="file" id="imageFile" accept="image/*" hidden>
    </div>

    <div class="editor" id="editor" contenteditable="true"
         role="textbox" aria-label="Contenu"
         aria-multiline="true"></div>

    <div class="html-editor hidden" id="htmlEditorWrap">
        <div class="html-toolbar">
            <button type="button" id="formatHtmlBtn" title="Indenter chaque balise sur sa ligne">✨ Formater</button>
            <span class="html-hint">Chaque balise sur sa ligne, indentation automatique</span>
            <button type="button" id="backToVisualBtn" title="Revenir à l'éditeur visuel">📝 Éditeur visuel</button>
        </div>
        <div class="html-code">
            <pre class="html-highlight" id="htmlHighlight" aria-hidden="true"></pre>
            <textarea id="htmlSource"
                class="html-source"
                wrap="soft"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
                aria-label="Code source HTML"
                placeholder="Modifie ton code HTML ici..."></textarea>
        </div>
    </div>

    <style>
/* ÉDITEUR DE CODE HTML */
.html-editor {
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    min-height: 0;
}

.html-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 9px;
    background: #111827;
    border: 1px solid #1e293b;
    border-bottom: 0;
    border-radius: 10px 10px 0 0;
    flex-shrink: 0;
    color: #cbd5e1;
    font-size: 12px;
}

.html-toolbar button {
    height: 34px;
    padding: 0 12px;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #1e293b;
    color: #e2e8f0;
    font-weight: 700;
    cursor: pointer;
    flex: 0 0 auto;
}

.html-toolbar button:hover { background: #334155; }
.html-toolbar #backToVisualBtn { margin-left: auto; }

.html-hint {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: .65;
}

.html-code {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    border: 1px solid #1e293b;
    border-top: 0;
    border-radius: 0 0 10px 10px;
    background: #0b1020;
    overflow: hidden;
}

.html-highlight,
.html-source {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 20px;
    border: 0;
    border-radius: 0;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.7;
    tab-size: 2;
    letter-spacing: normal;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
}

/* Le surligneur est derrière le textarea : le texte tapé reste invisible,
   seule la coloration est affichée. */
.html-highlight {
    overflow: hidden;
    pointer-events: none;
    color: #e2e8f0;
    background: transparent;
}

.html-source {
    background: transparent;
    color: transparent;
    caret-color: #f8fafc;
    resize: none;
    outline: none;
    overflow-x: hidden;
    overflow-y: auto;
}

.html-source::selection {
    background: rgba(59, 130, 246, .45);
    color: transparent;
}

.html-source:focus { box-shadow: none; }

.tok-tag { color: #f87171; font-weight: 600; }
.tok-attr { color: #4ade80; }
.tok-string { color: #86efac; }
.tok-comment { color: #94a3b8; font-style: italic; }
.tok-doctype { color: #fbbf24; }

#toggleViewHtml {
    background: #dbeafe;
    color: #1d4ed8;
    font-weight: bold;
}

@media(max-width:700px) {
    .html-highlight,
    .html-source {
        padding: 14px;
        font-size: 13px;
    }
    .html-toolbar { padding: 6px; }
    .html-hint { display: none; }
}

    <div class="actions">
        <button type="button" class="btn btn-primary" id="saveBtn">
            💾 Enregistrer
        </button>

        <button type="button" class="btn btn-secondary" id="refreshBtn">
            ↻ Actualiser
        </button>
    </div>
</div>

<script>
"use strict";

const API_URL = "https://script.google.com/macros/s/AKfycbyzhytA2z1Ln98MoybT00uwgjVlIUh5qPPpnQjwxXLJYkq6STke9QZ6VQgYMCNEEFGF/exec";
const $ = id => document.getElementById(id);

let seriesData = [];
let episodesData = [];
let currentSeriesId = "";
let currentEpisodeId = "";
let currentImageData = "";
let currentMode = "serie"; // "serie" ou "episode"



/* MESSAGES */
function message(text,type="info"){
    $("message").textContent = text;
    $("message").className = type;
}

function clearMessage(){
    $("message").textContent = "";
    $("message").className = "";
}

/* FERMER LE MESSAGE EN LE TOUCHANT */
$("message").addEventListener("click", clearMessage);

$("message").addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        clearMessage();
    }
});
/* MISE À JOUR DE L'AFFICHAGE DU MODE */
function updateUI(){
    const isSerie = currentMode === "serie";

    $("NomSerie").classList.toggle("hidden", !isSerie);
    $("titre").classList.toggle("hidden", isSerie);

    $("editor").setAttribute(
        "aria-label",
        isSerie ? "Description de la série" : "Contenu de l'épisode"
    );

    // Ajuster le libellé du bouton selon l'action
    if(isSerie){
        $("saveBtn").textContent = currentSeriesId ? "💾 Mettre à jour la série" : "💾 Créer la série";
    } else {
        $("saveBtn").textContent = currentEpisodeId ? "💾 Mettre à jour l'épisode" : "💾 Créer l'épisode";
    }
}

/* API GET */
async function apiGet(action,params={}){
    const url = new URL(API_URL);
    url.searchParams.set("action",action);

    Object.entries(params).forEach(([key,value])=>{
        url.searchParams.set(key,String(value));
    });

    const response = await fetch(url.toString());

    if(!response.ok){
        throw new Error("Erreur HTTP "+response.status);
    }

    const result = await response.json();

    if(result.status !== "success"){
        throw new Error(result.message || "Erreur du serveur.");
    }

    return result.data || [];
}

/* API POST */
async function apiPost(data){
    const response = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(data)
    });

    if(!response.ok){
        throw new Error("Erreur HTTP "+response.status);
    }

    const result = await response.json();

    if(result.status !== "success"){
        throw new Error(result.message || "Enregistrement impossible.");
    }

    return result;
}

/* CHARGER LES SÉRIES */
async function loadSeries(){
    const prevSeriesId = $("serie").value || currentSeriesId;

    try{
        message("Chargement des séries...");

        // On passe includeDrafts=true pour voir et modifier même les brouillons
        const data = await apiGet("getSeries", { includeDrafts: "true" });
        seriesData = Array.isArray(data) ? data : [];

        $("serie").innerHTML = '<option value="">➕ Nouvelle série</option>';

        seriesData.forEach(serie=>{
            const option = document.createElement("option");
            option.value = serie.id;
            const statutTxt = serie.statut === "Brouillon" ? " [Brouillon]" : "";
            option.textContent = (serie.titre || "Série sans titre") + statutTxt;
            $("serie").appendChild(option);
        });

        const serie = seriesData.find(item => String(item.id) === String(prevSeriesId));

        if(serie){
            $("serie").value = serie.id;
            currentSeriesId = serie.id;
        } else {
            $("serie").value = "";
            currentSeriesId = "";
            currentEpisodeId = "";
            episodesData = [];
            $("episode").disabled = true;
            $("episode").innerHTML = '<option value="">Sélectionne d\'abord une série</option>';
        }

        clearMessage();
        return serie || null;

    }catch(error){
        message("Impossible de charger les séries : "+error.message,"error");
        throw error;
    }
}

/* CHARGER LES ÉPISODES DE LA SÉRIE */
async function loadEpisodes(seriesId){
    episodesData = [];
    $("episode").disabled = true;
    $("episode").innerHTML = '<option value="">Chargement des épisodes...</option>';

    if(!seriesId){
        $("episode").innerHTML = '<option value="">Sélectionne d\'abord une série</option>';
        return [];
    }

    try{
        const result = await apiGet("getEpisodes",{
            seriesId: seriesId,
            includeDrafts: "true"
        });

        episodesData = result.filter(episode=>{
            const linkedId = episode.seriesId ?? episode.SeriesID ?? episode.seriesID;
            return String(linkedId) === String(seriesId);
        });

        // Options dans le menu des épisodes
        $("episode").innerHTML = `
            <option value="SERIE_EDIT">📝 Modifier les infos de la série</option>
            <option value="NEW_EPISODE">➕ Nouvel épisode</option>
        `;

        if(episodesData.length > 0){
            const group = document.createElement("optgroup");
            group.label = "Épisodes existants :";

            episodesData.forEach(episode=>{
                const option = document.createElement("option");
                option.value = episode.id;
                const statutTxt = episode.statut === "Brouillon" ? " [Brouillon]" : "";
                option.textContent = "🎬 " + (episode.titre || "Épisode sans titre") + statutTxt;
                group.appendChild(option);
            });

            $("episode").appendChild(group);
        }

        $("episode").disabled = false;
        return episodesData;

    }catch(error){
        $("episode").innerHTML = '<option value="SERIE_EDIT">📝 Modifier les infos de la série</option>';
        message("Erreur chargement des épisodes : "+error.message,"error");
        return [];
    }finally{
        $("episode").disabled = false;
    }
}

/* AFFICHER UNE SÉRIE DANS L'ÉDITEUR */
async function afficherSerie(seriesId){
    const serie = seriesData.find(item => String(item.id) === String(seriesId));

    if(!serie){
        message("Série introuvable.","error");
        return;
    }

    currentSeriesId = serie.id;
    currentEpisodeId = "";
    currentImageData = serie.image || "";
    currentMode = "serie";

    $("serie").value = serie.id;
    $("NomSerie").value = serie.titre || "";
    $("editor").innerHTML = serie.contenu || "";
    $("statut").value = serie.statut || "Publié";

    await loadEpisodes(seriesId);

    $("episode").value = "SERIE_EDIT";
    updateUI();
}

/* AFFICHER UN ÉPISODE DANS L'ÉDITEUR */
function afficherEpisode(episodeId){
    const episode = episodesData.find(item => String(item.id) === String(episodeId));

    if(!episode){
        message("Épisode introuvable.","error");
        return;
    }

    currentEpisodeId = episode.id;
    currentImageData = episode.image || "";
    currentMode = "episode";

    $("episode").value = episode.id;
    $("titre").value = episode.titre || "";
    $("editor").innerHTML = episode.contenu || "";
    $("statut").value = episode.statut || "Publié";

    updateUI();
    clearMessage();
}

/* PRÉPARER UN NOUVEL ÉPISODE */
function nouveauEpisode(){
    currentEpisodeId = "";
    currentImageData = "";
    currentMode = "episode";

    $("episode").value = "NEW_EPISODE";
    $("titre").value = "";
    $("editor").innerHTML = "";
    $("statut").value = "Publié";

    updateUI();
    $("titre").focus();
}

/* CHANGEMENT DE SÉRIE */
$("serie").addEventListener("change", async function(){
    clearMessage();
    const id = this.value;

    if(!id){
        // Nouvelle série
        currentSeriesId = "";
        currentEpisodeId = "";
        currentImageData = "";
        currentMode = "serie";

        $("NomSerie").value = "";
        $("editor").innerHTML = "";
        $("statut").value = "Publié";
        $("episode").disabled = true;
        $("episode").innerHTML = '<option value="">Sélectionne d\'abord une série</option>';

        updateUI();
        $("NomSerie").focus();
        return;
    }

    await afficherSerie(id);
});

/* CHANGEMENT D'ÉPISODE */
$("episode").addEventListener("change", function(){
    clearMessage();
    const val = this.value;

    if(val === "SERIE_EDIT"){
        // Retour à la modification des infos de la série
        const serie = seriesData.find(item => String(item.id) === String(currentSeriesId));
        if(serie){
            currentMode = "serie";
            currentEpisodeId = "";
            currentImageData = serie.image || "";
            $("NomSerie").value = serie.titre || "";
            $("editor").innerHTML = serie.contenu || "";
            $("statut").value = serie.statut || "Publié";
            updateUI();
        }
        return;
    }

    if(val === "NEW_EPISODE"){
        nouveauEpisode();
        return;
    }

    afficherEpisode(val);
});

/* EXTRAIRE LA PREMIÈRE IMAGE D'UN CONTENU HTML */
function extractFirstImage(html){
    const div = document.createElement("div");
    div.innerHTML = html;
    const img = div.querySelector("img");
    return img ? img.src : "";
}

/* CONVERTIR LES ANCIENNES BALISES <font> EN STYLES PROPRES */
const LEGACY_FONT_SIZES = {
    1: "10px", 2: "13px", 3: "16px", 4: "18px",
    5: "24px", 6: "32px", 7: "48px"
};

function normalizeLegacyFonts(html){
    if(!/<font[\s>]/i.test(html)) return html;

    const temp = document.createElement("div");
    temp.innerHTML = html;

    temp.querySelectorAll("font").forEach(font => {
        const span = document.createElement("span");
        const face = font.getAttribute("face");
        const size = font.getAttribute("size");
        const color = font.getAttribute("color");

        if(face) span.style.fontFamily = face;
        if(size && LEGACY_FONT_SIZES[size]) span.style.fontSize = LEGACY_FONT_SIZES[size];
        if(color) span.style.color = color;

        while(font.firstChild) span.appendChild(font.firstChild);
        font.replaceWith(span);
    });

    return temp.innerHTML;
}

/* ENREGISTRER OU METTRE À JOUR UNE SÉRIE OU UN ÉPISODE */
async function saveContent(){
    clearMessage();

    const nomSerie = $("NomSerie").value.trim();
    const titreEpisode = $("titre").value.trim();
    const rawContenu = htmlViewActive
        ? $("htmlSource").value
        : $("editor").innerHTML;
    const contenu = htmlViewActive ? rawContenu : normalizeLegacyFonts(rawContenu);

    const statut = $("statut").value;

    const firstImg = extractFirstImage(contenu);
    const finalImage = currentImageData || firstImg || "";

    try{
        $("saveBtn").disabled = true;
        $("saveBtn").textContent = "Enregistrement...";

        let result;

        /* =====================================
           CAS 1 : CRÉER OU METTRE À JOUR UNE SÉRIE
        ===================================== */
        if(currentMode === "serie"){
            if(!nomSerie){
                message("Veuillez entrer le nom de la série.","error");
                $("NomSerie").focus();
                return;
            }

            const payload = {
                type: "serie",
                titre: nomSerie,
                contenu: contenu,
                image: finalImage,
                statut: statut
            };

            // Si une série existante est sélectionnée, on envoie son ID pour la modifier
            if(currentSeriesId){
                payload.id = currentSeriesId;
            }

            result = await apiPost(payload);

            const savedId = payload.id || result.id;

            await loadSeries();

            if(savedId){
                currentSeriesId = savedId;
                $("serie").value = savedId;
                await loadEpisodes(savedId);
                $("episode").value = "SERIE_EDIT";
            }

            updateUI();
            message(result.message || (payload.id ? "Série mise à jour avec succès !" : "Série créée avec succès !"), "success");
            return;
        }

        /* =====================================
           CAS 2 : CRÉER OU METTRE À JOUR UN ÉPISODE
        ===================================== */
        if(!currentSeriesId){
            throw new Error("Sélectionne d'abord une série avant d'enregistrer un épisode.");
        }

        if(!titreEpisode){
            message("Veuillez entrer le titre de l'épisode.","error");
            $("titre").focus();
            return;
        }

        const episodePayload = {
            type: "episode",
            seriesId: currentSeriesId,
            titre: titreEpisode,
            contenu: contenu,
            image: finalImage,
            statut: statut
        };

        // Si on modifie un épisode existant, on envoie son ID
        if(currentEpisodeId){
            episodePayload.id = currentEpisodeId;
        }

        result = await apiPost(episodePayload);

        const savedEpId = episodePayload.id || result.id;

        await loadEpisodes(currentSeriesId);

        if(savedEpId){
            currentEpisodeId = savedEpId;
            $("episode").value = savedEpId;
        }

        updateUI();
        message(result.message || (episodePayload.id ? "Épisode mis à jour avec succès !" : "Épisode créé avec succès !"), "success");

    }catch(error){
        message("Erreur : "+error.message,"error");

    }finally{
        $("saveBtn").disabled = false;
        updateUI();
    }
}

/* BASCULER ENTRE L'ÉDITEUR VISUEL ET LE CODE HTML */
let htmlViewActive = false;

function escapeHtml(value){
    return String(value).replace(/[&<>]/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;"
    })[character]);
}

function highlightHtmlTag(token){
    const match = token.match(/^(<\/?)([a-zA-Z][\w:-]*)([\s\S]*?)(\/?>)$/);

    if(!match){
        return `<span class="tok-tag">${escapeHtml(token)}</span>`;
    }

    const [, opening, name, rest, closing] = match;
    let html = `<span class="tok-tag">${escapeHtml(opening + name)}</span>`;
    const attributePattern =
        /([a-zA-Z_:@][-a-zA-Z0-9_:.@]*)(\s*=\s*)("[^"]*"|'[^']*'|[^\s"'<>`]+)?|(\s+)/g;
    let index = 0;
    let attribute;

    while((attribute = attributePattern.exec(rest)) !== null){
        if(attribute.index > index){
            html += escapeHtml(rest.slice(index, attribute.index));
        }

        if(attribute[4]){
            html += attribute[0];
        }else{
            html += `<span class="tok-attr">${escapeHtml(attribute[1])}</span>`;
            if(attribute[2]) html += escapeHtml(attribute[2]);
            if(attribute[3]) html += `<span class="tok-string">${escapeHtml(attribute[3])}</span>`;
        }

        index = attributePattern.lastIndex;
    }

    if(index < rest.length) html += escapeHtml(rest.slice(index));

    html += `<span class="tok-tag">${escapeHtml(closing)}</span>`;
    return html;
}

const HTML_TOKEN_SOURCE =
    "<" + "!--[\\s\\S]*?-->|<!DOCTYPE[^>]*>|<\\/?[a-zA-Z][^>]*>|[^<]+|<";

function tokenizeHtml(source){
    return String(source).match(new RegExp(HTML_TOKEN_SOURCE, "g")) || [];
}

function highlightHtml(source){
    const tokens = tokenizeHtml(source);

    return tokens.map(token => {
        if(token.startsWith("<" + "!--")){
            return `<span class="tok-comment">${escapeHtml(token)}</span>`;
        }
        if(/^<!doctype/i.test(token)){
            return `<span class="tok-doctype">${escapeHtml(token)}</span>`;
        }
        if(token.startsWith("<")){
            return highlightHtmlTag(token);
        }
        return escapeHtml(token);
    }).join("");
}

function syncHtmlScroller(){
    const source = $("htmlSource");
    const highlight = $("htmlHighlight");
    if(!source || !highlight) return;

    const paddingRight = parseFloat(window.getComputedStyle(source).paddingRight) || 0;
    const scrollbarWidth = Math.max(source.offsetWidth - source.clientWidth, 0);

    highlight.style.paddingRight = (paddingRight + scrollbarWidth) + "px";
    highlight.scrollTop = source.scrollTop;
    highlight.scrollLeft = source.scrollLeft;
}

function renderHtmlHighlight(){
    const source = $("htmlSource");
    const highlight = $("htmlHighlight");
    if(!source || !highlight) return;

    highlight.innerHTML = highlightHtml(source.value);
    syncHtmlScroller();
}

/* FORMATAGE : UNE BALISE PAR LIGNE, INDENTÉE SELON SON ORDRE D'IMBRICATION */
const HTML_INLINE_TAGS = new Set([
    "a", "abbr", "b", "bdi", "bdo", "br", "cite", "code", "data", "del",
    "dfn", "em", "font", "i", "img", "ins", "kbd", "mark", "q", "s",
    "samp", "small", "span", "strong", "sub", "sup", "time", "u", "var", "wbr"
]);

const HTML_VOID_TAGS = new Set([
    "area", "base", "br", "col", "embed", "hr", "img", "input",
    "link", "meta", "param", "source", "track", "wbr"
]);

function formatHtml(source){
    const tokens = tokenizeHtml(source);

    const lines = [];
    let depth = 0;
    let buffer = "";

    const indent = () => "  ".repeat(Math.max(depth, 0));

    const flush = () => {
        const text = buffer.replace(/\s+/g, " ").trim();
        if(text) lines.push(indent() + text);
        buffer = "";
    };

    for(let i = 0; i < tokens.length; i++){
        const token = tokens[i];

        if(token.startsWith("<" + "!--")){
            flush();
            token.split(/\r?\n/).forEach(line => {
                if(line.trim()) lines.push(indent() + line.trim());
            });
            continue;
        }

        if(/^<!doctype/i.test(token)){
            flush();
            lines.push(indent() + token.trim());
            continue;
        }

        if(token.startsWith("<")){
            const match = token.match(/^<\s*(\/)?\s*([a-zA-Z][\w:-]*)/);

            if(!match){
                buffer += token;
                continue;
            }

            const isClosing = Boolean(match[1]);
            const name = match[2].toLowerCase();

            /* Les balises inline restent avec leur texte pour ne pas
               modifier l'affichage de l'article. */
            if(HTML_INLINE_TAGS.has(name)){
                buffer += token;
                continue;
            }

            flush();

            if(isClosing){
                depth = Math.max(depth - 1, 0);
                lines.push(indent() + token.trim());
                continue;
            }

            if(HTML_VOID_TAGS.has(name) || /\/>\s*$/.test(token)){
                lines.push(indent() + token.trim());
                continue;
            }

            /* Le contenu de pre, textarea, script et style
               est laissé intact. */
            if(["pre", "textarea", "script", "style"].includes(name)){
                let raw = "";
                let closeIndex = -1;
                const closingPattern = new RegExp("^<\\/\\s*" + name + "\\s*>$", "i");

                for(let j = i + 1; j < tokens.length; j++){
                    if(closingPattern.test(tokens[j].trim())){
                        closeIndex = j;
                        break;
                    }
                    raw += tokens[j];
                }

                if(closeIndex !== -1){
                    lines.push(
                        indent() + token.trim() + raw + tokens[closeIndex].trim()
                    );
                    i = closeIndex;
                    continue;
                }
            }

            lines.push(indent() + token.trim());
            depth++;
            continue;
        }

        buffer += token;
    }

    flush();

    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function setHtmlView(active){
    const visualEditor = $("editor");
    const htmlEditor = $("htmlSource");
    const htmlWrap = $("htmlEditorWrap");
    const richToolbar = $("richToolbar");

    if(active === htmlViewActive) return;

    if(active){
        htmlEditor.value = visualEditor.innerHTML;

        visualEditor.classList.add("hidden");
        richToolbar.classList.add("hidden");
        htmlWrap.classList.remove("hidden");

        htmlViewActive = true;
        renderHtmlHighlight();

        window.requestAnimationFrame(() => {
            syncHtmlScroller();
            htmlEditor.focus();
        });

        message("Mode HTML activé : balises en rouge, attributs en vert.", "info");
    }else{
        visualEditor.innerHTML = htmlEditor.value;

        htmlWrap.classList.add("hidden");
        richToolbar.classList.remove("hidden");
        visualEditor.classList.remove("hidden");

        htmlViewActive = false;
        visualEditor.focus();
        updateToolbarState();

        message("Les modifications HTML ont été appliquées.", "success");
    }
}

$("toggleViewHtml").addEventListener("click", () => setHtmlView(!htmlViewActive));
$("backToVisualBtn").addEventListener("click", () => setHtmlView(false));

$("htmlSource").addEventListener("input", renderHtmlHighlight);
$("htmlSource").addEventListener("scroll", syncHtmlScroller, { passive: true });
window.addEventListener("resize", syncHtmlScroller);

$("formatHtmlBtn").addEventListener("click", () => {
    const source = $("htmlSource");
    const formatted = formatHtml(source.value);

    if(formatted === source.value){
        message("Le HTML est déjà formaté.", "info");
        return;
    }

    source.value = formatted;
    source.scrollTop = 0;
    renderHtmlHighlight();
    message("HTML formaté : une balise par ligne, indentation automatique.", "success");
});

$("htmlSource").addEventListener("keydown", event => {
    if((event.ctrlKey || event.metaKey) && event.shiftKey &&
       event.key.toLowerCase() === "f"){
        event.preventDefault();
        $("formatHtmlBtn").click();
        return;
    }

    if(event.key === "Tab"){
        event.preventDefault();
        const source = $("htmlSource");
        const start = source.selectionStart;
        const end = source.selectionEnd;
        source.setRangeText("  ", start, end, "end");
        renderHtmlHighlight();
    }
});

/* SUPPRIMER TOUTES LES BALISES SAUF IMG ET A */
$("cleanTextBtn").addEventListener("click", function () {
    if (!confirm(
        "Supprimer toutes les balises HTML sauf les liens et les images ?"
    )) {
        return;
    }

    const editor = $("editor");

    // Copier le contenu pour le nettoyer.
    const temp = document.createElement("div");
    temp.innerHTML = editor.innerHTML;

    // Ajouter des retours à la ligne avant de retirer les balises
    // structurelles, pour éviter de coller tous les paragraphes.
    temp.querySelectorAll("br").forEach(el => {
        el.replaceWith(document.createTextNode("\n"));
    });

    temp.querySelectorAll(
        "p, div, h1, h2, h3, h4, h5, h6, li, blockquote, tr"
    ).forEach(el => {
        el.appendChild(document.createTextNode("\n"));
    });

    // Parcourir les éléments de l'intérieur vers l'extérieur.
    // Seules les balises <a> et <img> sont conservées.
    function nettoyer(parent) {
        Array.from(parent.childNodes).forEach(node => {
            if (node.nodeType === Node.ELEMENT_NODE) {
                nettoyer(node);

                const tag = node.tagName.toLowerCase();

                if (tag !== "a" && tag !== "img") {
                    // Retirer la balise en gardant son contenu.
                    node.replaceWith(...Array.from(node.childNodes));
                } else if (tag === "a") {
                    // Garder les attributs utiles du lien.
                    Array.from(node.attributes).forEach(attr => {
                        if (!["href", "target", "rel", "title", "download"]
                            .includes(attr.name.toLowerCase())) {
                            node.removeAttribute(attr.name);
                        }
                    });
                } else if (tag === "img") {
                    // Garder les informations nécessaires à l'image.
                    Array.from(node.attributes).forEach(attr => {
                        if (![
                            "src", "alt", "title", "width", "height",
                            "loading", "srcset", "sizes"
                        ].includes(attr.name.toLowerCase())) {
                            node.removeAttribute(attr.name);
                        }
                    });
                }
            }
        });
    }

    nettoyer(temp);

    // Nettoyer les espaces et les retours à la ligne excessifs.
    function nettoyerTexte(node) {
        Array.from(node.childNodes).forEach(child => {
            if (child.nodeType === Node.TEXT_NODE) {
                child.textContent = child.textContent
                    .replace(/\u00a0/g, " ")
                    .replace(/[ \t]+/g, " ");
            } else if (child.nodeType === Node.ELEMENT_NODE &&
                       child.tagName.toLowerCase() === "a") {
                // Ne pas modifier le contenu du lien.
            } else if (child.nodeType === Node.ELEMENT_NODE &&
                       child.tagName.toLowerCase() === "img") {
                // Conserver l'image.
            } else {
                nettoyerTexte(child);
            }
        });
    }

    nettoyerTexte(temp);

    // Récupérer le contenu nettoyé.
    editor.innerHTML = temp.innerHTML;

    message(
        "Formatage terminé : toutes les balises ont été supprimées sauf <a> et <img>.",
        "success"
    );

    editor.focus();
});

function updateToolbarState(){

    commandButtons.forEach(button => {
        let active = false;
        try{
            active = document.queryCommandState(button.dataset.command);
        }catch(error){}
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
    });
}

/* IMAGE : TÉLÉVERSEMENT DIRECT GOOGLE DRIVE */
$("imageBtn").addEventListener("click",()=>{
    $("imageFile").click();
});

$("imageFile").addEventListener("change",function(){
    const file = this.files[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
        message("Choisis un fichier image.","error");
        this.value = "";
        return;
    }

    if(file.size > 8 * 1024 * 1024){
        message("Image trop volumineuse. Choisis une image de moins de 8 Mo.","error");
        this.value = "";
        return;
    }

    message("Téléversement de l'image sur Google Drive en cours...","info");

    const reader = new FileReader();

    reader.onload = async ()=>{
        try {
            const result = await apiPost({
                type: "uploadImage",
                image: reader.result,
                prefix: currentMode === "serie" ? "Serie" : "Episode"
            });

            const driveUrl = result.imageUrl || result.url;

            if(!driveUrl){
                throw new Error("L'URL de l'image n'a pas été renvoyée par le serveur.");
            }

            currentImageData = driveUrl;

            $("editor").focus();
            document.execCommand("insertImage", false, driveUrl);

            message("Image téléversée avec succès sur Google Drive !","success");

        } catch(error) {
            message("Erreur lors du téléversement sur Drive : " + error.message, "error");
        }
    };

    reader.onerror = ()=>{
        message("Impossible de lire cette image.","error");
    };

    reader.readAsDataURL(file);
    this.value = "";
});
